name: Research DCA Execution Error Audit

on:
  pull_request:
    paths:
      - "engines/research/execution_error_audit.py"
      - "tests/test_execution_error_audit.py"
      - ".github/workflows/research_execution_error_audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy requests
      - run: python -m py_compile engines/research/execution_error_audit.py
      - run: python -m unittest discover -s tests -p "test_execution_error_audit.py" -v

  historical-readonly:
    needs: quality
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy requests
      - name: Evaluate historical 12/16 week VWAP execution errors
        env:
          AUDIT_GITHUB_REPO: aussiekarl-gif/btc-audit-data
          AUDIT_GITHUB_TOKEN: ${{ secrets.AUDIT_GITHUB_TOKEN }}
        run: python -m engines.research.execution_error_audit --output historical_execution_errors.json
      - uses: actions/upload-artifact@v4
        with:
          name: historical-execution-errors
          path: historical_execution_errors.json
