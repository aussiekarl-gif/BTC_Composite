name: Research Capped 10 Percent WMA Starter Stress

on:
  pull_request:
    paths:
      - 'engines/research/capped_wma_fallback_stress.py'
      - 'tests/test_capped_wma_fallback_stress.py'
      - '.github/workflows/capped_wma_fallback_stress.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixed-starter-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Verify causal 10 percent starter and dated paired crash replay
        run: |
          python -m py_compile engines/research/capped_wma_fallback_stress.py
          python -m unittest discover -s tests -p 'test_capped_wma_fallback_stress.py' -v
          python -m unittest discover -s tests -p 'test_fresh_cash_200wma_matched_backtest.py' -v
      - name: Replay real 2017/2021 starts and delayed synthetic downside with matched AUD FX
        run: |
          python -m engines.research.capped_wma_fallback_stress --output /tmp/capped_wma_fallback_stress.json
      - name: Keep all historical and synthetic portfolio fills for future independent audit
        uses: actions/upload-artifact@v4
        with:
          name: capped-10pct-wma-starter-stress
          path: /tmp/capped_wma_fallback_stress.json
          retention-days: 21
