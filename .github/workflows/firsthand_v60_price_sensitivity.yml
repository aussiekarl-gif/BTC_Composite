name: Firsthand V6.0 price-source portfolio sensitivity

on:
  push:
    branches: [research/firsthand-api-validation]
    paths:
      - "engines/research/firsthand_v60_price_sensitivity.py"
      - "engines/research/firsthand_cross_source_validation.py"
      - ".github/workflows/firsthand_v60_price_sensitivity.yml"
  pull_request:
    branches: [main]
    paths:
      - "engines/research/firsthand_v60_price_sensitivity.py"
      - "engines/research/firsthand_cross_source_validation.py"
      - ".github/workflows/firsthand_v60_price_sensitivity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile research replay
        run: python -m py_compile engines/research/firsthand_v60_price_sensitivity.py
      - name: Run matched V6.0 portfolio sensitivity
        run: python -m engines.research.firsthand_v60_price_sensitivity --output-dir artifacts/firsthand_v60_price_sensitivity
      - name: Upload matched replay and provenance
        uses: actions/upload-artifact@v4
        with:
          name: firsthand-v60-price-source-sensitivity
          path: artifacts/firsthand_v60_price_sensitivity/
          if-no-files-found: error
          retention-days: 90
