name: Research BTC spot depth prospective snapshots (no alerts)

on:
  pull_request:
    paths:
      - 'engines/research/btc_spot_depth_forward.py'
      - 'tests/test_btc_spot_depth_forward.py'
      - '.github/workflows/research_btc_spot_depth_forward.yml'
  workflow_dispatch:
  schedule:
    # Four snapshots daily at 01:17, 07:17, 13:17, 19:17 UTC.
    # Scheduled collection starts only once the research PR is merged to main.
    - cron: '17 1,7,13,19 * * *'

permissions:
  contents: write

concurrency:
  group: research-btc-spot-depth-forward
  cancel-in-progress: false

jobs:
  prospectively-observe-public-market:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public REST client for live source probe
        run: python -m pip install 'requests>=2.31,<3'
      - name: Run isolated offline validation
        run: |
          python -m py_compile engines/research/btc_spot_depth_forward.py
          python -m unittest discover -s tests -p 'test_btc_spot_depth_forward.py' -v
          python -m engines.research.btc_spot_depth_forward --self-check-only
      - name: Probe live public Kraken order book without writes or trade signals
        if: github.event_name == 'pull_request'
        run: python -m engines.research.btc_spot_depth_forward --probe-only
      - name: Capture one research-only public Kraken XBTUSD order book
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python -m engines.research.btc_spot_depth_forward
      - name: Preserve collected snapshot even if GitHub write is denied
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: research-kraken-spot-depth
          path: data/research_forward_validation/kraken_spot_depth_forward.csv
          if-no-files-found: ignore
          retention-days: 30
      - name: Commit only new immutable research spot-depth snapshot
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && success()
        shell: bash
        run: |
          set -euo pipefail
          path='data/research_forward_validation/kraken_spot_depth_forward.csv'
          test -f "$path" || { echo 'No verified snapshot output'; exit 1; }
          python -m engines.research.btc_spot_depth_forward --self-check-only
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$path"
          if git diff --cached --quiet; then
            echo 'This UTC sampling slot was already captured.'
          else
            git commit -m 'Research paper-only Kraken spot-depth snapshot [skip ci]'
            git push origin HEAD:main
          fi
