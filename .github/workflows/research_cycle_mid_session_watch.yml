name: Research Cycle mid-session market WATCH capture (NO ntfy)

on:
  pull_request:
    paths:
      - 'engines/research/cycle_mid_session_signal_tape.py'
      - 'tests/test_cycle_mid_session_signal_tape.py'
      - 'engines/research/cycle_mid_session_capture_health.py'
      - 'tests/test_cycle_mid_session_capture_health.py'
      - 'tests/test_cycle_mid_session_capture_workflow_priority.py'
      - '.github/workflows/research_cycle_mid_session_watch.yml'
  push:
    branches: [main]
    paths:
      - 'engines/research/cycle_mid_session_signal_tape.py'
      - 'tests/test_cycle_mid_session_signal_tape.py'
      - 'engines/research/cycle_mid_session_capture_health.py'
      - 'tests/test_cycle_mid_session_capture_health.py'
      - 'tests/test_cycle_mid_session_capture_workflow_priority.py'
      - '.github/workflows/research_cycle_mid_session_watch.yml'
  workflow_dispatch:
  schedule:
    # Weekdays 01:30 UTC = 11:30 Brisbane; Sydney 12:30 DST / 11:30 standard.
    # Actual capture must still pass the 11:00-15:00 Sydney time window.
    # One backup attempt at 02:30 UTC (12:30 Brisbane, 13:30 Sydney DST).
    # Already-saved Sydney dates are NOT refreshed or duplicated.
    # Delay hedge: 23:15 UTC Sunday-Thursday is 10:15 Sydney AEDT
    # / 09:15 Sydney AEST on the NEXT Sydney weekday. If GitHub starts
    # promptly, skip before the 11am actual-time window with NO feed call.
    # If GitHub queues for several hours, this may land 11am-3pm.
    - cron: '15 23 * * 0-4'
    - cron: '30 1,2 * * 1-5'

permissions:
  contents: write

concurrency:
  group: research-cycle-mid-session-watch-source
  cancel-in-progress: false

jobs:
  collect-public-only:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check ACTUAL Sydney collection window before public feed or expensive tests
        id: capture_window
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p artifacts/mid_session_capture
          # stdlib-only time check, no external BTC provider or pandas.
          if python -m engines.research.cycle_microstructure_mid_session_backup --is-window > artifacts/mid_session_capture/actual_window_gate.json; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub capture started outside the real Sydney 11:00-15:00 window. No BTC data request, no fabricated record."
          fi
      - name: Install only public-source capture dependencies when ACTUALLY in window
        if: steps.capture_window.outputs.eligible == 'true'
        run: python -m pip install 'numpy>=1.26' 'pandas>=2' 'requests>=2.31'
      - name: Capture a NEW actual verified mid-session market WATCH (research only)
        id: prospective_capture
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && steps.capture_window.outputs.eligible == 'true'
        shell: bash
        run: |
          # Actual scheduled-run evidence is archived even if BTC provider
          # verification or source serialization fails. This is NOT a
          # backfill, a trading alert, or a second observation.
          mkdir -p artifacts/mid_session_capture
          python - <<'PY' > artifacts/mid_session_capture/run_context.json
          import datetime as dt, json, os
          from zoneinfo import ZoneInfo
          now=dt.datetime.now(dt.timezone.utc)
          print(json.dumps({
            "kind":"MID_SESSION_SCHEDULED_CAPTURE_RUN_START",
            "started_utc":now.isoformat(),
            "sydney_local_time":now.astimezone(ZoneInfo("Australia/Sydney")).isoformat(),
            "github_run_id":os.environ.get("GITHUB_RUN_ID"),
            "github_run_attempt":os.environ.get("GITHUB_RUN_ATTEMPT"),
            "github_event":os.environ.get("GITHUB_EVENT_NAME"),
            "historical_backfills_allowed":False,
            "ntfy_posted":False,
            "orders_placed":0,
          },sort_keys=True))
          PY
          set +e
          python -m engines.research.cycle_mid_session_signal_tape > artifacts/mid_session_capture/capture_transcript.txt 2>&1
          result=$?
          set -e
          cat artifacts/mid_session_capture/capture_transcript.txt
          printf '{"capture_exit_code":%s}\n' "$result" > artifacts/mid_session_capture/capture_exit.json
          if [ "$result" -ne 0 ]; then
            echo "::error::Actual prospective mid-session capture failed; no substitute price or backfill."
          fi
          exit "$result"
      - name: PR/push only - prove fast path imports with minimal public provider packages
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: |
          python -m pip install 'numpy>=1.26' 'pandas>=2' 'requests>=2.31'
          python - <<'PY'
          from engines.research.cycle_mid_session_signal_tape import capture_window, read_tape
          from engines.research.cycle_microstructure_mid_session_backup import eligibility
          import datetime as dt
          assert callable(capture_window) and callable(read_tape)
          assert eligibility(dt.datetime(2026,10,22,2,0,tzinfo=dt.timezone.utc))['eligible']
          print('Verified minimal actual-time public source capture imports')
          PY
      - name: Install complete dependencies for regression validation
        if: github.event_name == 'pull_request' || github.event_name == 'push' || steps.prospective_capture.outcome == 'success'
        run: python -m pip install -r requirements.txt
      - name: Validate shared Cycle allocation, source date and immutable tape AFTER capture
        id: full_validation
        if: github.event_name == 'pull_request' || github.event_name == 'push' || steps.prospective_capture.outcome == 'success'
        run: |
          python -m unittest discover -s tests -p 'test_cycle_mid_session_capture_workflow_priority.py' -v
          python -m py_compile engines/research/cycle_mid_session_signal_tape.py
          python -m unittest discover -s tests -p 'test_cycle_mid_session_signal_tape.py' -v
          python -m unittest discover -s tests -p 'test_cycle_mid_session_capture_health.py' -v
          python -m unittest discover -s tests -p 'test_cycle_trading_pct_allocation.py' -v
          python -m unittest discover -s tests -p 'test_shared_cycle_live_completed_utc.py' -v
          python -m engines.research.cycle_mid_session_signal_tape --self-check-only
      - name: Read-only probe ACTUAL public BTC and FX source before first scheduled run
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: python -m engines.research.cycle_mid_session_signal_tape --probe-only
      - name: Diagnose missed or unavailable mid-session source without backfill
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.capture_window.outputs.eligible == 'true' && !cancelled()
        shell: bash
        run: |
          # If actual scheduled capture failed, record a visible Actions
          # warning, not a fake timestamp or a retroactive BUY/SELL.
          python - <<'PY'
          import datetime as dt
          from zoneinfo import ZoneInfo
          from engines.research.cycle_mid_session_signal_tape import read_tape
          sydney_now=dt.datetime.now(dt.timezone.utc).astimezone(ZoneInfo("Australia/Sydney"))
          today=sydney_now.date().isoformat()
          rows=read_tape()
          if rows and rows[-1]["research_sydney_date"]==today:
              print(f"::notice::Verified prospective Cycle mid-session source recorded for {today}: "+
                    rows[-1]["captured_at_utc"])
          else:
              print(f"::warning::No valid prospective Cycle mid-session row for Sydney {today}; "+
                    "do NOT backfill; inspect preceding capture-stage errors and GitHub scheduler.")
          PY
          if ! python -m engines.research.cycle_mid_session_signal_tape --probe-only; then
            echo '::warning::Current public BTC, FX or halving source FAILED passive probe; no research tape changes.'
          fi
      - name: Preserve ACTUAL run transcript and immutable source evidence, including failures
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: prospective-cycle-mid-session-market-watch
          path: |
            artifacts/mid_session_capture/
            data/research_forward_validation/cycle_mid_session_market_watch.csv
          if-no-files-found: ignore
          retention-days: 30
    # Capture may be attempted ASAP; every published observation still
    # REQUIRES the identical full original regression suite to PASS.
    # No data is trusted solely because the fast capture step succeeded.
      - name: Save only new immutable research source row, no portfolio or ntfy
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && steps.prospective_capture.outcome == 'success' && steps.full_validation.outcome == 'success' && success()
        shell: bash
        run: |
          set -euo pipefail
          python -m engines.research.cycle_mid_session_signal_tape --self-check-only
          path='data/research_forward_validation/cycle_mid_session_market_watch.csv'
          test -f "$path"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$path"
          if git diff --cached --quiet; then
            echo 'Research Sydney date already captured; original evidence left unchanged.'
          else
            git commit -m 'Research prospective Cycle mid-session market WATCH [skip ci]'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
