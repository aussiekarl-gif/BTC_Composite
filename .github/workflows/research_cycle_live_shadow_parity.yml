name: Research Cycle exact-live-rule order shadow (no alerts)

on:
  pull_request:
    paths:
      - 'engines/research/cycle_live_order_shadow_replay.py'
      - 'tests/test_cycle_live_order_shadow_replay.py'
      - '.github/workflows/research_cycle_live_shadow_parity.yml'
  push:
    branches: [main]
    paths:
      - 'engines/research/cycle_live_order_shadow_replay.py'
      - 'tests/test_cycle_live_order_shadow_replay.py'
      - '.github/workflows/research_cycle_live_shadow_parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-rule-shadow-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimum research import dependencies
        run: python -m pip install pandas numpy requests
      - name: Verify existing Cycle decision unchanged and validate research-only replay
        run: |
          python -m py_compile engines/research/cycle_live_order_shadow_replay.py
          python -m unittest discover -s tests -p 'test_cycle_live_order_shadow_replay.py' -v
          python -m unittest discover -s tests -p 'test_cycle_trading_pct_allocation.py' -v
