name: Research Variable Duration DCA Execution

on:
  pull_request:
    paths:
      - "engines/research/adaptive_dca_execution.py"
      - "tests/test_adaptive_dca_execution.py"
      - ".github/workflows/adaptive_dca_execution_research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  causal-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy requests
      - run: python -m py_compile engines/research/adaptive_dca_execution.py
      - run: python -m unittest discover -s tests -p "test_adaptive_dca_execution.py" -v

  historical-audit:
    needs: causal-tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy requests
      - name: Run adaptive open-ended buying and selling audit
        env:
          AUDIT_GITHUB_REPO: aussiekarl-gif/btc-audit-data
          AUDIT_GITHUB_TOKEN: ${{ secrets.AUDIT_GITHUB_TOKEN }}
        run: python -m engines.research.adaptive_dca_execution --output adaptive_execution_results.json
      - uses: actions/upload-artifact@v4
        with:
          name: variable-duration-dca-execution
          path: adaptive_execution_results.json
