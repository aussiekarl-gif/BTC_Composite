name: Prospective Adaptive Recovery Replay

on:
  pull_request:
    paths:
      - "engines/research/prospective_adaptive_recovery_replay.py"
      - "engines/research/run_prospective_adaptive_recovery_replay.py"
      - "tests/test_prospective_adaptive_recovery_replay.py"
      - ".github/workflows/prospective_adaptive_recovery_replay.yml"
      - "docs/research/prospective_adaptive_recovery_replay_20261127.md"\n      - "engines/research/shared_cycle_policy.py"
      - "engines/research/v60_historical_report.py"
      - "data/mvrv_z_score_2026-10-06T21-46-14.csv"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install repository dependencies
        run: pip install -r requirements.txt
      - name: Compile replay and runner
        run: python -m py_compile engines/research/prospective_adaptive_recovery_replay.py engines/research/run_prospective_adaptive_recovery_replay.py
      - name: Run deterministic synthetic cohort tests
        run: python -m unittest discover -s tests -p "test_prospective_adaptive_recovery_replay.py" -v
      - name: Run historical calendar-enrolled cohorts
        run: python engines/research/run_prospective_adaptive_recovery_replay.py
      - name: Upload research outputs and source metadata
        uses: actions/upload-artifact@v4
        with:
          name: prospective-adaptive-recovery-replay
          path: research_artifacts/prospective_adaptive_recovery_replay/
          if-no-files-found: error
          retention-days: 14
