name: Real-History Cycle Backtest

on:
  pull_request:
    paths:
      - "engines/research/run_cycle_backtest.py"
      - "engines/research/run_timing_comparison.py"
      - "engines/research/cycle_backtest.py"
      - "engines/shared/central_data.py"
      - ".github/workflows/real-history-cycle-backtest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-history-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests
      - name: Compile research backtest
        run: python -m py_compile engines/research/run_cycle_backtest.py engines/research/run_timing_comparison.py engines/research/cycle_backtest.py engines/shared/central_data.py
      - name: Verify central audit-data access
        env:
          AUDIT_GITHUB_TOKEN: ${{ secrets.AUDIT_GITHUB_TOKEN || secrets.BTC_CENTRAL_DATA_TOKEN }}
        run: |
          if [[ -z "$AUDIT_GITHUB_TOKEN" ]]; then
            echo "::error::Configure AUDIT_GITHUB_TOKEN or BTC_CENTRAL_DATA_TOKEN in BTC_Composite repository secrets with read access to aussiekarl-gif/btc-audit-data."
            exit 1
          fi
      - name: Run full historical backtest
        env:
          PYTHONUNBUFFERED: "1"
          AUDIT_GITHUB_TOKEN: ${{ secrets.AUDIT_GITHUB_TOKEN || secrets.BTC_CENTRAL_DATA_TOKEN }}
        run: |
          set -o pipefail
          python engines/research/run_cycle_backtest.py | tee cycle-backtest-results.json
      - name: Run same-window timing comparison
        env:
          PYTHONUNBUFFERED: "1"
          AUDIT_GITHUB_TOKEN: ${{ secrets.AUDIT_GITHUB_TOKEN || secrets.BTC_CENTRAL_DATA_TOKEN }}
        run: |
          set -o pipefail
          python engines/research/run_timing_comparison.py | tee timing-comparison-results.json
      - name: Upload timing comparison
        uses: actions/upload-artifact@v4
        with:
          name: btc-timing-comparison-results
          path: timing-comparison-results.json
          if-no-files-found: error
      - name: Upload numerical results
        uses: actions/upload-artifact@v4
        with:
          name: btc-cycle-backtest-results
          path: cycle-backtest-results.json
          if-no-files-found: error
