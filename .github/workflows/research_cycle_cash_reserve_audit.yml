name: Research BTC 200WMA cash reserve floors (strictly paper)

on:
  pull_request:
    paths:
      - 'engines/research/cycle_deep_value_cash_reserve_audit.py'
      - 'tests/test_cycle_deep_value_cash_reserve_audit.py'
      - '.github/workflows/research_cycle_cash_reserve_audit.yml'
  push:
    branches: [main]
    paths:
      - 'engines/research/cycle_deep_value_cash_reserve_audit.py'
      - 'tests/test_cycle_deep_value_cash_reserve_audit.py'
      - '.github/workflows/research_cycle_cash_reserve_audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-causal-reserved-cash:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing research dependencies
        run: python -m pip install -r requirements.txt
      - name: Test reference match, reserve cash floors, 7-day cooldown and no lookahead
        run: |
          python -m py_compile engines/research/cycle_deep_value_cash_reserve_audit.py
          python -m unittest discover -s tests -p 'test_cycle_deep_value_cash_reserve_audit.py' -v
          python -m unittest discover -s tests -p 'test_cycle_conditional_deep_value_buy_audit.py' -v
          python -m unittest discover -s tests -p 'test_live_weekly_buy_parity.py' -v
          python -m unittest discover -s tests -p 'test_cycle_trading_pct_allocation.py' -v
      - name: Replay matched historical cohorts and synthetic further 50/70 percent declines
        run: |
          python -m engines.research.cycle_deep_value_cash_reserve_audit --out artifacts/research_cycle_200wma_cash_reserve
      - name: Preserve research-only detailed matched cash accounts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle-200wma-cash-reserve-protection-paper-audit
          path: artifacts/research_cycle_200wma_cash_reserve/
          retention-days: 30
          if-no-files-found: ignore
      - name: Confirm untouched actual BTC/ASX tapes, Cycle, models and notifications
        run: git diff --exit-code -- data/research_forward_validation/ engines/production/ engines/research/cycle_trade_allocation.py cycle_trading_daily_ntfy.py
