name: Research Full-Cycle Capital Recycling (read-only)

on:
  pull_request:
    paths:
      - "engines/research/full_cycle_reinvestment.py"
      - "tests/test_full_cycle_reinvestment.py"
      - "engines/research/exit_confirmation_audit.py"
      - "tests/test_exit_confirmation_audit.py"
      - "engines/research/diminishing_cycle_smsf_projection.py"
      - "tests/test_diminishing_cycle_smsf_projection.py"
      - ".github/workflows/full_cycle_reinvestment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy requests
      - name: Compile module
        run: python -m py_compile engines/research/full_cycle_reinvestment.py
      - name: Validate deterministic accounting
        run: |
          python -m unittest discover -s tests -p "test_full_cycle_reinvestment.py" -v
          python -m unittest discover -s tests -p "test_exit_confirmation_audit.py" -v
          python -m unittest discover -s tests -p "test_diminishing_cycle_smsf_projection.py" -v

  historical-read-only:
    needs: unit-tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy requests
      - name: Run full-history continuous AUD accounting
        env:
          AUDIT_GITHUB_REPO: aussiekarl-gif/btc-audit-data
          AUDIT_GITHUB_TOKEN: ${{ secrets.AUDIT_GITHUB_TOKEN }}
        run: python -m engines.research.full_cycle_reinvestment --output full_cycle_reinvestment_results.json
      - name: Run read-only arm-and-confirm exit analysis
        env:
          AUDIT_GITHUB_REPO: aussiekarl-gif/btc-audit-data
          AUDIT_GITHUB_TOKEN: ${{ secrets.AUDIT_GITHUB_TOKEN }}
        run: python -m engines.research.exit_confirmation_audit --output exit_confirmation_results.json
      - name: Generate hypothetical 2026 to 2038 SMSF scenarios
        run: python -m engines.research.diminishing_cycle_smsf_projection --output diminishing_cycle_smsf_scenarios.json
      - name: Upload read-only aggregate results
        uses: actions/upload-artifact@v4
        with:
          name: full-cycle-reinvestment-report
          path: |
            full_cycle_reinvestment_results.json
            exit_confirmation_results.json
            diminishing_cycle_smsf_scenarios.json
