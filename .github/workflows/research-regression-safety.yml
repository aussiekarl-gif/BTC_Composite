name: Research regression safety

on:
  push:
    branches:
      - research/cycle-strategy-optimization
    paths:
      - 'engines/research/cycle_backtest.py'
      - 'engines/research/wma_window_backtest.py'
      - 'engines/research/compare_wma_windows.py'
      - 'tests/test_cycle_execution_safety.py'
      - 'tests/test_wma_window_backtest.py'
      - '.github/workflows/research-regression-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install numpy pandas
      - name: Run research-only regression tests
        run: python -m unittest discover -s tests -p 'test_*backtest.py' -v
      - name: Run execution lag safety checks
        run: python -m unittest discover -s tests -p 'test_cycle_execution_safety.py' -v
