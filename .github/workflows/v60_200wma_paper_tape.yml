name: V6.0 prospective 200WMA paper tape (research only)

on:
  schedule:
    # After the shared BTC and ASX close tapes have normally been captured.
    - cron: '23 10 * * *'
    - cron: '53 10 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - "engines/research/v60_200wma_paper_tape.py"
      - "tests/test_v60_200wma_paper_tape.py"
      - ".github/workflows/v60_200wma_paper_tape.yml"

permissions:
  contents: read

concurrency:
  group: v60-prospective-paper-tape
  cancel-in-progress: false

jobs:
  offline-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Test V6.0 prospective cutoff, hash chain and exact ASX matching
        run: python -m unittest discover -s tests -p "test_v60_200wma_paper_tape.py" -v
      - name: Compile isolated V6.0 paper tape
        run: python -m py_compile engines/research/v60_200wma_paper_tape.py

  record-prospective-observation:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: offline-safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Read existing append-only V6.0 tapes from isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/research/v60-paper-tape
          mkdir -p /tmp/v60_paper
          git show FETCH_HEAD:data/research_forward_validation/v60_200wma_paper_signals.csv > /tmp/v60_paper/old_signals.csv
          git show FETCH_HEAD:data/research_forward_validation/v60_200wma_paper_asx_observations.csv > /tmp/v60_paper/old_asx.csv
          cp /tmp/v60_paper/old_signals.csv /tmp/v60_paper/new_signals.csv
          cp /tmp/v60_paper/old_asx.csv /tmp/v60_paper/new_asx.csv
      - name: Capture only new prospective Sunday close and exact next ASX session
        shell: bash
        run: |
          set -euo pipefail
          python -m engines.research.v60_200wma_paper_tape             --btc-tape data/research_forward_validation/cycle_market_signals.csv             --asx-tape data/research_forward_validation/asx_ibit_closes_forward.csv             --signal-tape /tmp/v60_paper/new_signals.csv             --execution-tape /tmp/v60_paper/new_asx.csv             --status-file /tmp/v60_paper/status.json
      - name: Retain research-only evidence artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: v60-prospective-paper-tape-capture
          path: /tmp/v60_paper/
          if-no-files-found: warn
          retention-days: 90
      - name: Publish new append-only records to isolated V6.0 branch
        shell: bash
        run: |
          set -euo pipefail
          status="$(jq -r .status /tmp/v60_paper/status.json)"
          if [[ "$status" != "captured" ]]; then
            echo "No new eligible prospective Sunday/ASX observation; no commit."
            jq '{status,paper_start_after_utc,first_eligible_sunday_close_utc,signal_rows,asx_observation_rows,unmatched_signal_rows}' /tmp/v60_paper/status.json >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git fetch --no-tags origin refs/heads/research/v60-paper-tape
          git show FETCH_HEAD:data/research_forward_validation/v60_200wma_paper_signals.csv | cmp - /tmp/v60_paper/old_signals.csv
          git show FETCH_HEAD:data/research_forward_validation/v60_200wma_paper_asx_observations.csv | cmp - /tmp/v60_paper/old_asx.csv
          git checkout --detach FETCH_HEAD
          cp /tmp/v60_paper/new_signals.csv data/research_forward_validation/v60_200wma_paper_signals.csv
          cp /tmp/v60_paper/new_asx.csv data/research_forward_validation/v60_200wma_paper_asx_observations.csv
          cp /tmp/v60_paper/status.json data/research_forward_validation/v60_200wma_paper_status.json
          git config user.name 'v60-research-paper-bot'
          git config user.email 'v60-research-paper-bot@users.noreply.github.com'
          git add --             data/research_forward_validation/v60_200wma_paper_signals.csv             data/research_forward_validation/v60_200wma_paper_asx_observations.csv             data/research_forward_validation/v60_200wma_paper_status.json
          git diff --cached --quiet && exit 0
          git commit -m 'RESEARCH ONLY: append V6.0 prospective 200WMA observation [skip ci]'
          git push origin HEAD:refs/heads/research/v60-paper-tape
          jq '{status,paper_start_after_utc,first_eligible_sunday_close_utc,signal_rows,asx_observation_rows,unmatched_signal_rows,trade_executable}' data/research_forward_validation/v60_200wma_paper_status.json >> "$GITHUB_STEP_SUMMARY"
