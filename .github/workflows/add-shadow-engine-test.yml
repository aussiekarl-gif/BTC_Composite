name: Add shadow Production engine test
on:
  push:
    branches: [shadow-production-engine-test]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch parity lab
        env:
          PATCH_B64: ""
        run: |
          python - <<'PY'
          import os, base64
          from pathlib import Path
          Path('/tmp/patch.py').write_bytes(base64.b64decode(os.environ['PATCH_B64']))
          PY
          python /tmp/patch.py
      - name: Validate
        run: |
          python -m py_compile engines/shared/parity_app.py
          python - <<'PY'
          from pathlib import Path
          s = Path('engines/shared/parity_app.py').read_text()
          assert 'Shadow Production engine test' in s
          assert 'shadow/production_input_candidate.csv' in s
          assert 'Production remains on its existing live data path' in s
          PY
      - name: Commit patch and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/add-shadow-engine-test.yml
          git add engines/shared/parity_app.py .github/workflows/add-shadow-engine-test.yml
          git commit -m "Add shadow Production engine test to parity lab"
          git push
