name: One-time formatted live Cycle notification test
on:
  push:
    branches:
      - test/one-time-mobile-ntfy-20261017-1129
permissions:
  contents: read
jobs:
  user-requested-test:
    if: github.event.head_commit.message == 'User-requested formatted live Cycle ntfy test (one time)'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Deliver a single clearly marked Markdown ntfy preview with real data
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python - <<'PY'
          import os
          import re
          import requests
          from cycle_trading_daily_ntfy import daily_message
          from engines.research.cycle_model_redflags import fetch_reference_model_risks
          topic=os.environ.get("NTFY_TOPIC","").strip()
          if not topic:
              raise RuntimeError("No ntfy topic configured, no message sent")
          references=fetch_reference_model_risks()
          day,body=daily_message(reference_snapshot_fetcher=lambda:references)
          required=(
              "Cycle signal: ","**BUY allocation:","**SELL allocation:",
              "BTC close US$","Prior 200WMA US$","ASX:IBIT A$",
              "**📈 MARKET SNAPSHOT**","**🧭 OTHER MODELS**",
              "Production:","Research:",
          )
          missing=[part for part in required if part not in body]
          if missing or "DATA UNAVAILABLE" in body:
              raise RuntimeError(f"Did not send: incomplete live preview: {missing}")
          for name in ("Production:","Research:"):
              line=next((line for line in body.splitlines() if line.startswith("- "+name)),"")
              if "risk " not in line:
                  raise RuntimeError(f"Did not send: unavailable {name} risk score")
          signal=re.search(r"Cycle signal: (HOLD|BUY WATCH|SELL WATCH)",body)
          if not signal:
              raise RuntimeError("Did not send: unknown Cycle signal")
          test_title="TEST - BTC Cycle - "+signal.group(1)
          test_body=(
              "**🧪 TEST ONLY — NEW MOBILE FORMAT**\n"
              "*Requested preview. Not another daily trading instruction.*\n\n"
              +body
          )
          url=topic.rstrip("/") if topic.startswith(("https://","http://")) else "https://ntfy.sh/"+topic.strip("/")
          response=requests.post(
              url,data=test_body.encode("utf-8"),
              headers={"Title":test_title,"Priority":"default",
                       "Tags":"test_tube","Markdown":"yes","Cache":"no"},
              timeout=20,
          )
          response.raise_for_status()
          print("FORMATTED_LIVE_NTFY_TEST_SUCCESS")
          print("Preview date:",day,"Signal:",signal.group(1))
          print("Production and Research: dated risk values present")
          PY
