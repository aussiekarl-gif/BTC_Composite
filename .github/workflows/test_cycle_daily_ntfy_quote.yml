name: IBIT Quote and Daily Cycle Notification Safety

on:
  pull_request:
    paths:
      - "engines/research/ibit_quote.py"
      - "engines/research/cycle_halving_countdown.py"
      - "tests/test_cycle_halving_and_quote_display.py"
      - "engines/research/cycle_trading_app.py"
      - "cycle_trading_daily_ntfy.py"
      - "engines/research/cycle_trade_allocation.py"
      - "tests/test_cycle_daily_ntfy_quote.py"
      - "tests/test_cycle_trading_pct_allocation.py"
      - ".github/workflows/cycle_trading_daily_ntfy.yml"
      - ".github/workflows/dca_model_compare_notify.yml"
      - ".github/workflows/validation_research_tuning.yml"
      - "engines/research/cycle_trade_execution_safety.py"
      - "engines/research/cycle_market_feed.py"
      - "engines/research/cycle_live_feed_check.py"
      - "tests/test_cycle_trading_sensecheck.py"
      - "tests/test_cycle_market_feed.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quote-and-notification-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m py_compile engines/research/ibit_quote.py engines/research/cycle_trading_app.py cycle_trading_daily_ntfy.py engines/research/cycle_halving_countdown.py
      - run: python -m unittest discover -s tests -p 'test_cycle_daily_ntfy_quote.py' -v
      - run: python -m unittest discover -s tests -p 'test_cycle_halving_and_quote_display.py' -v
      - run: python -m unittest discover -s tests -p 'test_cycle_trade_decision.py' -v
      - name: Verify Streamlit and ntfy percentages match
        run: python -m unittest discover -s tests -p 'test_cycle_trading_pct_allocation.py' -v

      - name: Validate transaction cooldown and fully dated online price references
        run: |
          python -m unittest discover -s tests -p 'test_cycle_trading_sensecheck.py' -v
          python -m unittest discover -s tests -p 'test_cycle_market_feed.py' -v

      - name: Read-only public BTC/AUD and IBIT quote health smoke test (nonblocking)
        continue-on-error: true
        run: python -m engines.research.cycle_live_feed_check
