name: Research causal history comparison
on:
  push:
    branches: [research/cycle-strategy-optimization]
    paths:
      - '.github/workflows/research_causal_history.yml'
      - 'engines/research/build_causal_history.py'
      - 'engines/research/run_cycle_comparison.py'
      - 'engines/research/run_stored_usd_comparison.py'
      - 'engines/research/test_200wma_entry.py'
      - 'engines/research/test_200wma_weighted.py'
      - 'engines/research/test_200wma_core_satellite.py'
      - 'engines/research/test_200wma_roundtrip.py'
      - 'engines/research/test_200wma_percentage_bands.py'
      - 'engines/research/test_200wma_tier_ladders.py'
      - 'engines/research/test_200wma_start_sensitivity.py'
      - 'engines/research/test_200wma_exact_10x10.py'
      - 'engines/research/test_200wma_12week_execution.py'
      - 'engines/research/btc_200wma_history.py'
      - 'engines/research/test_200wma_aud_currency_impact.py'
      - 'engines/research/test_200wma_smsf_costs.py'
      - 'engines/research/test_200wma_idle_cash_recycling.py'
      - 'engines/research/smsf_cgt_ledger.py'
      - 'engines/research/test_200wma_lower_tier_sensitivity.py'
      - 'engines/research/test_200wma_overlap_slippage.py'
      - 'engines/research/test_200wma_fixed_horizon.py'
      - 'engines/research/test_200wma_cash_deployment.py'
      - 'engines/research/test_200wma_integrated_cash_and_trading.py'
  workflow_dispatch:
    inputs:
      start:
        description: "First BTC observation date"
        required: false
        default: "2015-01-01"
      end:
        description: "Last BTC observation date"
        required: false
        default: "2026-10-14"
jobs:
  historical-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install pandas numpy requests
      - name: Historical USD benchmark from archived provider data
        run: python -m engines.research.run_stored_usd_comparison
      - name: Archive USD benchmark immediately
        uses: actions/upload-artifact@v4
        with:
          name: stored-usd-cycle-benchmark
          path: research_outputs/stored_usd_comparison.json
      - name: Backtest 200WMA buy-only entries
        run: python -m engines.research.test_200wma_entry
      - name: Archive 200WMA results immediately
        uses: actions/upload-artifact@v4
        with:
          name: 200wma-entry-usd-results
          path: research_outputs/200wma_entry_usd.json
      - name: Backtest weighted 200WMA across start years
        run: python -m engines.research.test_200wma_weighted
      - name: Archive weighted 200WMA cohort results
        uses: actions/upload-artifact@v4
        with:
          name: 200wma-weighted-cohorts
          path: research_outputs/200wma_weighted_cohorts.json
      - name: Test core BTC plus 200WMA reserve
        run: python -m engines.research.test_200wma_core_satellite
      - name: Archive core satellite results
        uses: actions/upload-artifact@v4
        with:
          name: 200wma-core-satellite
          path: research_outputs/200wma_core_satellite.json
      - name: Backtest 200WMA cycle sells and rebuys
        run: python -m engines.research.test_200wma_roundtrip
      - name: Archive 200WMA round-trip results
        uses: actions/upload-artifact@v4
        with:
          name: 200wma-roundtrip
          path: research_outputs/200wma_roundtrip.json
      - name: Test 200WMA percentage deviation bands
        run: python -m engines.research.test_200wma_percentage_bands
      - name: Archive percentage-band results
        uses: actions/upload-artifact@v4
        with:
          name: 200wma-percentage-bands
          path: research_outputs/200wma_percentage_bands.json
      - name: Test scaled 200WMA sell and rebuy ladders
        run: python -m engines.research.test_200wma_tier_ladders
      - name: Archive tier-ladder results
        uses: actions/upload-artifact@v4
        with:
          name: 200wma-tier-ladders
          path: research_outputs/200wma_tier_ladders.json
      - name: Test four-week rolling start-date sensitivity
        run: python -m engines.research.test_200wma_start_sensitivity
      - name: Archive rolling start-date results
        uses: actions/upload-artifact@v4
        with:
          name: 200wma-start-sensitivity
          path: research_outputs/200wma_start_sensitivity.json
      - name: Test exact 10x10 repeated percentage tiers
        run: python -m engines.research.test_200wma_exact_10x10
      - name: Archive exact 10x10 tier results
        uses: actions/upload-artifact@v4
        with:
          name: 200wma-exact-10x10
          path: research_outputs/200wma_exact_10x10.json
      - name: Compare 12-week staged execution strategies
        run: python -m engines.research.test_200wma_12week_execution
      - name: Archive 12-week execution comparisons
        uses: actions/upload-artifact@v4
        with:
          name: 200wma-12week-execution
          path: research_outputs/200wma_12week_execution.json
      - name: Audit staged execution overlap and slippage
        run: python -m engines.research.test_200wma_overlap_slippage
      - name: Archive overlap and slippage audit
        uses: actions/upload-artifact@v4
        with:
          name: 200wma-overlap-slippage
          path: research_outputs/200wma_overlap_slippage.json
      - name: Compare lower selling tiers and trading fee sensitivity
        run: python -m engines.research.test_200wma_lower_tier_sensitivity
      - name: Archive lower-tier sensitivity results
        uses: actions/upload-artifact@v4
        with:
          name: 200wma-lower-tier-sensitivity
          path: research_outputs/200wma_lower_tier_fee_sensitivity.json
      - name: Compare fixed two-, three- and four-year holding windows
        run: python -m engines.research.test_200wma_fixed_horizon
      - name: Archive fixed-horizon results
        uses: actions/upload-artifact@v4
        with:
          name: 200wma-fixed-horizon
          path: research_outputs/200wma_fixed_horizon_robustness.json
      - name: Compare cash-first BTC DCA deployment strategies
        run: python -m engines.research.test_200wma_cash_deployment
      - name: Archive cash-first DCA results
        uses: actions/upload-artifact@v4
        with:
          name: 200wma-cash-deployment
          path: research_outputs/200wma_cash_deployment.json
      - name: Test integrated cash-first buying with staged sell and rebuy
        run: python -m engines.research.test_200wma_integrated_cash_and_trading
      - name: Archive integrated cash and trading evidence
        uses: actions/upload-artifact@v4
        with:
          name: 200wma-integrated-cash-trading
          path: research_outputs/200wma_integrated_cash_and_trading.json
      - name: Build causal weekly BTC AUD history
        run: python -m engines.research.build_causal_history --start "${{ inputs.start || '2015-01-01' }}" --end "${{ inputs.end || '2026-10-14' }}" --out research_outputs/causal_btc_aud_weekly.csv
      - name: Compare AUD and USD cash-first 200WMA trading on identical cohorts
        run: python -m engines.research.test_200wma_aud_currency_impact
      - name: Archive AUD currency robustness test
        uses: actions/upload-artifact@v4
        with:
          name: 200wma-aud-currency-impact
          path: research_outputs/200wma_aud_currency_impact.json
      - name: Compare AUD BTC ETF brokerage expense and SMSF CGT stress
        run: python -m engines.research.test_200wma_smsf_costs --currency AUD
      - name: Archive AUD SMSF cost stress results
        uses: actions/upload-artifact@v4
        with:
          name: 200wma-smsf-costs-aud
          path: research_outputs/200wma_smsf_cost_stress_aud.json
      - name: Test after-tax idle cash recycling with 26 and 52-week rules
        run: python -m engines.research.test_200wma_idle_cash_recycling
      - name: Archive idle-cash recycling sensitivity
        uses: actions/upload-artifact@v4
        with:
          name: 200wma-idle-cash-recycling-aud
          path: research_outputs/200wma_idle_cash_recycling_aud.json
      - name: Compare strategies on chronological holdouts
        run: python -m engines.research.run_cycle_comparison --csv research_outputs/causal_btc_aud_weekly.csv --walk-forward --out research_outputs/comparison.jsonl
      - name: Archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causal-btc-cycle-research
          path: research_outputs/
