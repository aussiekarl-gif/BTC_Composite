name: Shadow engine patch v3
on:
  push:
    branches:
      - shadow-production-engine-test
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch parity lab
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('engines/shared/parity_app.py')
          s = p.read_text()
          imp = 'from engines.shared.shadow_engine_test import render_shadow_engine_test\n'
          if imp not in s:
              marker = 'from engines.shared.central_data import CentralDataConfig, CentralDataError, load_master\n'
              if marker not in s:
                  raise SystemExit('import marker missing')
              s = s.replace(marker, marker + imp, 1)
          call = 'render_shadow_engine_test(cfg)\n\n'
          anchor = 'st.caption("No files were written and no Production/Research data source was changed by this parity check.")\n'
          if call not in s:
              if anchor not in s:
                  raise SystemExit('end anchor missing')
              s = s.replace(anchor, call + anchor, 1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          python -m py_compile engines/shared/parity_app.py engines/shared/shadow_engine_test.py
          python - <<'PY'
          from pathlib import Path
          s = Path('engines/shared/parity_app.py').read_text()
          assert 'from engines.shared.shadow_engine_test import render_shadow_engine_test' in s
          assert 'render_shadow_engine_test(cfg)' in s
          PY
      - name: Commit patch and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/add-shadow-engine-test.yml .github/workflows/shadow-engine-patch-v2.yml .github/workflows/shadow-engine-patch-v3.yml
          git add -A
          git commit -m "Wire shadow Production engine test into parity lab"
          git push
