name: BTC Composite DCA Risk Monitor

on:
  schedule:
    # Daily, 08:15 UTC.
    # Daily execution is required for the two-day confirmation rule.
    - cron: "15 8 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create runtime config
        env:
          CRYPTOQUANT_API_KEY: ${{ secrets.CRYPTOQUANT_API_KEY }}
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          cp config.example.json config.json

          python - <<'PY'
          import json
          import os

          with open("config.json", "r", encoding="utf-8") as f:
              config = json.load(f)

          config["cryptoquant_api_key"] = os.environ["CRYPTOQUANT_API_KEY"]
          config["coinglass_api_key"] = os.environ["COINGLASS_API_KEY"]
          config["ntfy_topic"] = os.environ["NTFY_TOPIC"]
          config["ntfy_token"] = os.environ.get("NTFY_TOKEN", "")

          with open("config.json", "w", encoding="utf-8") as f:
              json.dump(config, f, indent=2)
              f.write("\n")
          PY

      - name: Restore manual realised price
        env:
          MANUAL_REALISED_PRICE_USD: ${{ secrets.MANUAL_REALISED_PRICE_USD }}
        run: |
          mkdir -p data

          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          value = os.environ.get("MANUAL_REALISED_PRICE_USD")
          if not value:
              raise SystemExit(
                  "MANUAL_REALISED_PRICE_USD GitHub secret is required "
                  "while realised_price_source is set to manual."
              )

          payload = {
              "as_of_utc": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "realised_price_usd": float(value)
          }

          with open("data/manual_metrics.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2)
              f.write("\n")
          PY

      - name: Run monitor
        run: python btc_composite_dca.py

      - name: Commit non-secret state and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/risk_history.csv data/state.json

          git diff --cached --quiet || \
            git commit -m "Update BTC composite DCA monitor state"

          git push
