name: BTC Composite DCA Monitor

on:
  schedule:
    # Runs daily at 08:15 UTC.
    # Daily is needed because confirmation_days is 2.
    - cron: "15 8 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Create private runtime configuration
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          cp config.example.json config.json

          python - <<'PY'
          import json
          import os

          with open("config.json", "r", encoding="utf-8") as file:
              config = json.load(file)

          config["ntfy_topic"] = os.environ.get("NTFY_TOPIC", "")
          config["ntfy_token"] = os.environ.get("NTFY_TOKEN", "")

          with open("config.json", "w", encoding="utf-8") as file:
              json.dump(config, file, indent=2)
              file.write("\n")
          PY

      - name: Run BTC DCA monitor
        run: python btc_composite_dca.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Save state and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/risk_history.csv data/state.json

          git diff --cached --quiet || \
            git commit -m "Update BTC DCA monitor history"

          git push
