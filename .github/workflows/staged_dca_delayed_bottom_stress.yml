name: BTC Staged DCA Delayed Bottom Stress Research

on:
  pull_request:
    paths:
      - 'engines/research/staged_dca_delayed_bottom_stress.py'
      - 'engines/research/staged_tax_aware_roundtrip.py'
      - 'tests/test_staged_dca_delayed_bottom_stress.py'
      - '.github/workflows/staged_dca_delayed_bottom_stress.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delayed-bottom-research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Validate no-lookahead BTC stress and audited self-financing replay
        run: |
          python -m py_compile engines/research/staged_dca_delayed_bottom_stress.py engines/research/staged_tax_aware_roundtrip.py
          python -m unittest discover -s tests -p 'test_staged_dca_delayed_bottom_stress.py' -v
          python -m unittest discover -s tests -p 'test_staged_tax_aware_roundtrip.py' -v
      - name: Replay actual historical pre-shock cycles with synthetic delayed bear bottoms
        run: |
          python -m engines.research.staged_dca_delayed_bottom_stress --output /tmp/btc_staged_delayed_bottom_stress.json
      - name: Archive paired scenario details and full trade ledgers
        uses: actions/upload-artifact@v4
        with:
          name: btc-staged-delayed-bottom-stress
          path: /tmp/btc_staged_delayed_bottom_stress.json
          retention-days: 14
