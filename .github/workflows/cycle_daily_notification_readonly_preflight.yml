name: Cycle Trading Read-Only Daily Message Preflight

on:
  pull_request:
    paths:
      - 'engines/research/cycle_daily_notification_readonly_preflight.py'
      - 'engines/research/cycle_live_completed_utc_prices.py'
      - 'engines/research/cycle_forward_kraken_bridge.py'
      - 'tests/test_shared_cycle_live_completed_utc.py'
      - 'tests/test_cycle_daily_ntfy_quote.py'
      - '.github/workflows/cycle_daily_notification_readonly_preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-public-btc-and-daily-ntfy-without-sending:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing source and renderer dependencies
        run: python -m pip install -r requirements.txt
      - name: Run original Cycle and ntfy functionality assertions
        run: |
          python -m py_compile engines/research/cycle_daily_notification_readonly_preflight.py
          python -m unittest discover -s tests -p 'test_shared_cycle_live_completed_utc.py' -v
          python -m unittest discover -s tests -p 'test_cycle_daily_ntfy_quote.py' -v
      - name: Full independent real public BTC date and DAILY MESSAGE render, NO notification
        run: python -m engines.research.cycle_daily_notification_readonly_preflight
      - name: Confirm no trading, market tape, or ntfy reservation changed
        run: git diff --exit-code -- data/ .github/notification_state/
