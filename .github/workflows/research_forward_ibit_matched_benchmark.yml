name: Research forward ASX matched-BTC policy benchmarking (no orders)

on:
  pull_request:
    paths:
      - 'engines/research/forward_ibit_matched_benchmark.py'
      - 'engines/research/forward_ibit_first_session_acceptance.py'
      - 'tests/test_forward_ibit_first_session_acceptance.py'
      - 'engines/research/ibit_asx_public_probe.py'
      - 'tests/test_ibit_asx_public_probe.py'
      - 'tests/test_forward_ibit_matched_benchmark.py'
      - '.github/workflows/research_forward_ibit_matched_benchmark.yml'
      - '.github/workflows/research_forward_cycle_tape.yml'
  push:
    branches: [main]
    paths:
      - 'engines/research/forward_ibit_matched_benchmark.py'
      - 'engines/research/forward_ibit_first_session_acceptance.py'
      - 'tests/test_forward_ibit_first_session_acceptance.py'
      - 'tests/test_forward_ibit_matched_benchmark.py'
      - '.github/workflows/research_forward_ibit_matched_benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-frozen-forward-ASX-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing BTC research dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate source provenance and three cash-funded paper policies
        run: |
          python -m py_compile engines/research/forward_ibit_matched_benchmark.py
          python -m unittest discover -s tests -p 'test_forward_ibit_matched_benchmark.py' -v
          python -m unittest discover -s tests -p 'test_forward_ibit_first_session_acceptance.py' -v
          python -m unittest discover -s tests -p 'test_ibit_asx_public_probe.py' -v
          python -m unittest discover -s tests -p 'test_cycle_trading_pct_allocation.py' -v
          python -m unittest discover -s tests -p 'test_ibit_asx_forward_close_tape.py' -v
      - name: Check actual Yahoo AUD IBIT daily-candle schema (READ-ONLY no tape writes)
        run: python -m engines.research.ibit_asx_public_probe
      - name: Preview authentic point-in-time comparison, without network/trading/writes
        run: python -m engines.research.forward_ibit_matched_benchmark
      - name: Reconcile first genuine 2026-10-20 ASX matched-capital paper session, NO LIVE ORDER
        run: python -m engines.research.forward_ibit_first_session_acceptance
      - name: Retain read-only first-session equal-AUD evidence
        uses: actions/upload-artifact@v4
        with:
          name: forward-ibit-first-session-causal-paper-acceptance
          path: artifacts/forward_ibit_first_actual_session.json
          if-no-files-found: error
          retention-days: 30
      - name: Keep immutable source records and scheduled jobs unchanged
        run: git diff --exit-code -- data/research_forward_validation/
