name: Fix source capture picker
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply targeted fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('engines/audit/public_model_audit.py')
          s=p.read_text()
          old='col = pick_column(frame, aliases)'
          new='col = _pick(frame, aliases)'
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          python -m py_compile engines/audit/public_model_audit.py
          python - <<'PY'
          from pathlib import Path
          s=Path('engines/audit/public_model_audit.py').read_text()
          assert 'col = pick_column(frame, aliases)' not in s
          assert 'col = _pick(frame, aliases)' in s
          assert 'def _pick(frame, aliases):' in s
          print('source capture picker validation passed')
          PY
      - name: Commit final patch and remove helper
        run: |
          rm .github/workflows/fix-source-capture-picker.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engines/audit/public_model_audit.py .github/workflows/fix-source-capture-picker.yml
          git commit -m 'Fix undefined source capture column picker'
          git push
