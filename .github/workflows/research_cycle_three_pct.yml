name: Research Cycle 3 Percent Weekly Allocation Stress

on:
  pull_request:
    paths:
      - 'engines/research/cycle_three_percent_audit.py'
      - 'tests/test_cycle_three_percent_audit.py'
      - '.github/workflows/research_cycle_three_pct.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  three-percent-conditional-research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing dependencies
        run: python -m pip install -r requirements.txt
      - name: Check exact 7-day current BUY engine + new 3% branch
        run: |
          python -m py_compile engines/research/cycle_three_percent_audit.py
          python -m unittest discover -s tests -p 'test_cycle_three_percent_audit.py' -v
          python -m unittest discover -s tests -p 'test_live_weekly_buy_parity.py' -v
          python -m unittest discover -s tests -p 'test_cycle_trading_pct_allocation.py' -v
      - name: Replay 2017 2021 and censored 2026 plus 8 deep-market stress paths
        run: python -m engines.research.cycle_three_percent_audit --out artifacts/cycle_three_pct
      - name: Preserve full dated matched cash and BTC histories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle-3pct-vs-original-2p5-and-existing-3p5
          path: artifacts/cycle_three_pct/
          if-no-files-found: ignore
