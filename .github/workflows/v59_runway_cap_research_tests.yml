name: V5.9 runway cap research tests
on:
  pull_request:
    paths:
      - 'engines/research/v59_runway_cap_replay.py'
      - 'tests/test_v59_runway_cap_replay.py'
      - 'engines/research/v59_dynamic_risk_policy.py'
      - 'engines/research/v59_adaptive_ceiling_backtest.py'
      - 'tests/test_v59_adaptive_ceiling_backtest.py'
      - 'tests/test_v59_dynamic_risk_policy.py'
      - '.github/workflows/v59_runway_cap_research_tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runway-cap-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_v59_runway_cap_replay.py' -v
      - run: python -m unittest discover -s tests -p 'test_v59_dynamic_risk_policy.py' -v
      - run: python -m unittest discover -s tests -p 'test_v59_adaptive_ceiling_backtest.py' -v
