name: Research Hybrid DCA Core and Reserve

on:
  pull_request:
    paths:
      - "engines/research/hybrid_core_reserve_audit.py"
      - "tests/test_hybrid_core_reserve_audit.py"
      - ".github/workflows/research_hybrid_core_reserve.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hybrid-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy requests
      - run: python -m py_compile engines/research/hybrid_core_reserve_audit.py
      - run: python -m unittest discover -s tests -p "test_hybrid_core_reserve_audit.py" -v

  public-extended-historical-test:
    needs: hybrid-unit-tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy requests
      - name: Evaluate 2026 hybrid and matched 2019-2025 historical regimes
        env:
          AUDIT_GITHUB_REPO: aussiekarl-gif/btc-audit-data
          AUDIT_GITHUB_TOKEN: ${{ secrets.AUDIT_GITHUB_TOKEN }}
        run: python -m engines.research.hybrid_core_reserve_audit --asof 2026-10-16 --output research_hybrid_core_reserve_results.json
      - uses: actions/upload-artifact@v4
        with:
          name: research-hybrid-core-reserve-readonly
          path: research_hybrid_core_reserve_results.json
