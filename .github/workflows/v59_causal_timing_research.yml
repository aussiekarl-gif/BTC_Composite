name: V5.9 causal BTC buy-timing horse race (research only)
on:
  pull_request:
    paths:
      - 'engines/research/v59_causal_timing_horse_race.py'
      - 'tests/test_v59_causal_timing_horse_race.py'
      - '.github/workflows/v59_causal_timing_research.yml'
      - 'engines/research/research_model.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  causal-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BTC_PORTFOLIO_BACKEND: sqlite
      BTC_PORTFOLIO_DB_PATH: /tmp/v59_timing_tests_only.sqlite3
      NTFY_TOPIC: ''
      GOOGLE_SERVICE_ACCOUNT_JSON: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_v59_causal_timing_horse_race.py' -v
      - run: python -m py_compile engines/research/v59_causal_timing_horse_race.py
  actual-public-history:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BTC_PORTFOLIO_BACKEND: sqlite
      BTC_PORTFOLIO_DB_PATH: /tmp/v59_timing_research_only.sqlite3
      NTFY_TOPIC: ''
      GOOGLE_SERVICE_ACCOUNT_JSON: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Retrospective matched BTC/AUD 2017-2024 cohorts — no private portfolio data
        run: python -m engines.research.v59_causal_timing_horse_race --out artifacts/v59_buy_timing_horse_race.json
      - name: Retain complete audit as artifact, not a live recommendation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-v59-timing-horse-race-report
          path: artifacts/v59_buy_timing_horse_race.json
          if-no-files-found: warn
          retention-days: 90
