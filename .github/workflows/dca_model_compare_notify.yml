name: Daily BTC DCA model comparison

on:
  schedule:
    - cron: "15 10 * * *"
      timezone: "Australia/Brisbane"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send BTC DCA comparison to ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BGEOMETRICS_TOKEN: ${{ secrets.BGEOMETRICS_TOKEN }}
        run: python dca_model_compare_notify.py
