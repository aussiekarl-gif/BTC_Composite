name: Research Halving Clock Top Windows

on:
  pull_request:
    paths:
      - "engines/research/halving_window_top_audit.py"
      - "tests/test_halving_window_top_audit.py"
      - ".github/workflows/research_halving_top_windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixed-window-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy
      - run: python -m py_compile engines/research/halving_window_top_audit.py
      - run: python -m unittest discover -s tests -p "test_halving_window_top_audit.py" -v

  archived-price-historical-audit:
    needs: fixed-window-tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy
      - name: Compare fixed calendar sell windows to all named historical peaks
        run: python -m engines.research.halving_window_top_audit --output halving_top_windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: research-halving-top-window-causality
          path: halving_top_windows.json
