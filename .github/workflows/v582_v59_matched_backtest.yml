name: Matched V5.8.2 vs V5.9 historical backtest (research only)
on:
  pull_request:
    paths:
      - 'engines/research/v582_v59_matched_backtest.py'
      - 'tests/test_v582_v59_matched_backtest.py'
      - 'engines/research/research_model.py'
      - 'engines/production/production_model.py'
      - 'engines/research/production_causal_budget_audit.py'
      - 'engines/research/v59_causal_timing_horse_race.py'
      - 'engines/research/top_signal_horse_race.py'
      - '.github/workflows/v582_v59_matched_backtest.yml'
  workflow_dispatch:
  schedule:
    - cron: '37 4 * * 1'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BTC_PORTFOLIO_BACKEND: sqlite
      BTC_PORTFOLIO_DB_PATH: /tmp/v582_v59_tests.sqlite3
      NTFY_TOPIC: ''
      GOOGLE_SERVICE_ACCOUNT_JSON: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_v582_v59_matched_backtest.py' -v
      - run: python -m py_compile engines/research/v582_v59_matched_backtest.py
  matched-public-history:
    if: ${{ github.event_name != 'pull_request' || needs.offline-tests.result == 'success' }}
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BTC_PORTFOLIO_BACKEND: sqlite
      BTC_PORTFOLIO_DB_PATH: /tmp/v582_v59_history.sqlite3
      NTFY_TOPIC: ''
      GOOGLE_SERVICE_ACCOUNT_JSON: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Run same-input V5.8.2 vs V5.9 backtest
        run: python -m engines.research.v582_v59_matched_backtest --out artifacts/v582_v59_matched_backtest.json
      - name: Summarise matched research results
        run: |
          {
            echo '## RESEARCH ONLY — V5.8.2 vs V5.9 MATCHED BACKTEST'
            echo ''
            jq '{status,weekly_observations,completed_cohorts,summary,limitations}' artifacts/v582_v59_matched_backtest.json
            echo ''
            echo 'No Production settings, portfolio, broker orders or notifications changed.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain complete cohort report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v582-v59-matched-backtest
          path: artifacts/v582_v59_matched_backtest.json
          if-no-files-found: error
          retention-days: 90
