name: Research Real 2026 A$500k DCA Start

on:
  pull_request:
    paths:
      - "engines/research/real_2026_deployment_audit.py"
      - "engines/research/adaptive_dca_execution.py"
      - "tests/test_real_2026_deployment_audit.py"
      - ".github/workflows/research_real_2026_start.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invariant-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy requests
      - run: python -m py_compile engines/research/real_2026_deployment_audit.py engines/research/adaptive_dca_execution.py
      - run: python -m unittest discover -s tests -p "test_real_2026_deployment_audit.py" -v
      - run: python -m unittest discover -s tests -p "test_adaptive_dca_execution.py" -v
      - run: python -m unittest discover -s tests -p "test_smsf_self_financing_replay.py" -v

  historical-data-readonly:
    needs: invariant-tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy requests
      - name: Audit Jan/June 2026 fresh-capital start without touching portfolio
        env:
          AUDIT_GITHUB_REPO: aussiekarl-gif/btc-audit-data
          AUDIT_GITHUB_TOKEN: ${{ secrets.AUDIT_GITHUB_TOKEN }}
        run: python -m engines.research.real_2026_deployment_audit --output real_2026_start_comparison.json
      - uses: actions/upload-artifact@v4
        with:
          name: research-2026-aud-500k-start
          path: real_2026_start_comparison.json
