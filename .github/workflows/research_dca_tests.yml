name: Research DCA regression tests

on:
  pull_request:
    paths:
      - "engines/research/**"
      - "tests/**"
      - ".github/workflows/research_dca_tests.yml"
  push:
    branches: [main]
    paths:
      - "engines/research/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/research_dca_tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run research DCA regression tests
        run: |
          python -m unittest discover -s tests -p 'test_bottom_challenger_sizing.py' -v
          python -m unittest discover -s tests -p 'test_below_200wma_carry.py' -v
          python -m unittest discover -s tests -p 'test_cgt_scenarios.py' -v
