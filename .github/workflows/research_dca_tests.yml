name: Research DCA regression tests

on:
  pull_request:
    paths:
      - "engines/research/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/research_dca_tests.yml"
  push:
    branches: [main]
    paths:
      - "engines/research/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/research_dca_tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run research DCA regression tests
        run: |
          python -m unittest discover -s tests -p 'test_bottom_challenger_sizing.py' -v
          python -m unittest discover -s tests -p 'test_below_200wma_carry.py' -v
          python -m unittest discover -s tests -p 'test_v59_dynamic_risk_policy.py' -v
          python -m unittest discover -s tests -p 'test_v59_external_risk_ladders.py' -v
          python -m unittest discover -s tests -p 'test_app_risk_ladder.py' -v
          python -m unittest discover -s tests -p 'test_v59_risk_ui_acceptance.py' -v
          python -m unittest discover -s tests -p 'test_v59_200wma_distance_dynamic_dca.py' -v
          python -m py_compile engines/research/v59_200wma_distance_dynamic_dca.py engines/shared/dca_purchase_status.py engines/production/production_model.py engines/research/research_model.py engines/production/production_app.py engines/research/research_app.py
