name: Classify Regime Score as optional context
on:
  push:
    branches:
      - classify-regime-as-optional-context
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/patch_regime_optional.py
      - name: Validate
        run: |
          python -m py_compile engines/shared/parity_app.py
          python - <<'PY'
          from pathlib import Path
          s = Path('engines/shared/parity_app.py').read_text()
          assert 'Optional context — not used in Risk Score/DCA sizing' in s
          assert 'True Production-critical central-source gaps' in s
          assert 'parity[["Input","Role"' in s
          PY
      - name: Commit patch and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/classify-regime-optional.yml tools/patch_regime_optional.py
          git add -A
          git commit -m "Classify Regime Score as optional parity context"
          git push
