name: Research Real Cycle Weekly BUY Parity and Small Sizing Challengers

on:
  pull_request:
    paths:
      - 'engines/research/live_weekly_buy_parity.py'
      - 'tests/test_live_weekly_buy_parity.py'
      - '.github/workflows/research_live_weekly_buy_parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-exact-current-2p5pct-and-alternatives:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project frozen research requirements
        run: python -m pip install -r requirements.txt
      - name: Test identical Streamlit market buy and 7-day cooldown
        run: |
          python -m py_compile engines/research/live_weekly_buy_parity.py
          python -m unittest discover -s tests -p 'test_live_weekly_buy_parity.py' -v
          python -m unittest discover -s tests -p 'test_cycle_trading_pct_allocation.py' -v
          python -m unittest discover -s tests -p 'test_cycle_trading_sensecheck.py' -v
      - name: Run fresh-cash 2017 2021 2026 plus 50-70pct delayed bottom stress
        run: python -m engines.research.live_weekly_buy_parity --out artifacts/live_weekly_buy_parity
      - name: Save full matched BUY orders and terminal AUD net of illustrative FIFO CGT
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle-live-weekly-buy-2p5-vs-3p5-vs-5pct
          path: artifacts/live_weekly_buy_parity/
          if-no-files-found: ignore
