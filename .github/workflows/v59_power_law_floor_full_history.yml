name: V5.9 full-history Power Law floor audit (research only)
on:
  push:
    branches: [main]
    paths:
      - 'engines/research/v59_power_law_floor_full_history.py'
      - 'engines/research/research_model.py'
      - '.github/workflows/v59_power_law_floor_full_history.yml'
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * 1'
permissions:
  contents: read
jobs:
  full-history-floor-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BTC_PORTFOLIO_BACKEND: sqlite
      BTC_PORTFOLIO_DB_PATH: /tmp/v59_power_law_floor_audit.sqlite3
      NTFY_TOPIC: ''
      GOOGLE_SERVICE_ACCOUNT_JSON: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Rebuild V5.9 R2 weekly risk and residual from public BTC history
        run: python -m engines.research.v59_power_law_floor_full_history
      - name: Retain reproducible research audit
        uses: actions/upload-artifact@v4
        with:
          name: v59-power-law-floor-full-history
          path: artifacts/v59_power_law_floor_full_history.json
          if-no-files-found: error
          retention-days: 90
