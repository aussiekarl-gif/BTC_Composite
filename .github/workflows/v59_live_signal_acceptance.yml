name: V5.9 prospective signal acceptance (read-only)
on:
  pull_request:
    paths:
      - 'engines/research/v59_live_signal_snapshot.py'
      - 'tests/test_v59_live_signal_snapshot.py'
      - '.github/workflows/v59_live_signal_acceptance.yml'
      - 'engines/research/research_model.py'
  push:
    branches: [main]
    paths:
      - 'engines/research/v59_live_signal_snapshot.py'
      - 'tests/test_v59_live_signal_snapshot.py'
      - '.github/workflows/v59_live_signal_acceptance.yml'
      - 'engines/research/research_model.py'
  schedule:
    # 10:20 AM Brisbane (UTC+10) every calendar day; no ntfy message.
    - cron: '20 0 * * *'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  test-prospective-risk-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BTC_PORTFOLIO_BACKEND: sqlite
      BTC_PORTFOLIO_DB_PATH: /tmp/v59_risk_snapshot_offline.sqlite3
      NTFY_TOPIC: ''
      GOOGLE_SERVICE_ACCOUNT_JSON: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_v59_live_signal_snapshot.py' -v
      - run: python -m py_compile engines/research/v59_live_signal_snapshot.py
  real-live-source-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      BTC_PORTFOLIO_BACKEND: sqlite
      BTC_PORTFOLIO_DB_PATH: /tmp/v59_risk_snapshot_no_real_portfolio.sqlite3
      NTFY_TOPIC: ''
      GOOGLE_SERVICE_ACCOUNT_JSON: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Capture actual closed BTC + FX and evaluate V5.9 R2 research score
        run: python -m engines.research.v59_live_signal_snapshot --out artifacts/research_v59_live_signal_snapshot.json
      - name: Retain dated, non-personal market signal for prospective verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-v59-live-signal-observation
          path: artifacts/research_v59_live_signal_snapshot.json
          if-no-files-found: warn
          retention-days: 90
