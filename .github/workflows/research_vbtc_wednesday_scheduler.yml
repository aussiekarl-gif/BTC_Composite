name: Research VBTC paper Wednesday scheduler

# Scheduling is deliberately restricted to the default (main) branch.
# It runs and commits ONLY research/cycle-strategy-optimization paper data.
# 23:17 Tuesday UTC = 09:17 Wednesday Brisbane (AEST, UTC+10).
on:
  schedule:
    - cron: '17 23 * * 2'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: research-forward-200wma-v1
  cancel-in-progress: false

jobs:
  run-paper-only:
    if: github.repository == 'aussiekarl-gif/BTC_Composite'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fail closed unless launched from main
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Scheduler must execute on the default branch only."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" != "schedule" && "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "Unexpected invocation event."
            exit 1
          fi

      - name: Checkout Research only (never Production)
        uses: actions/checkout@v4
        with:
          ref: research/cycle-strategy-optimization
          fetch-depth: 1
          persist-credentials: false

      - name: Verify research checkout and frozen policy
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git branch --show-current)" == "research/cycle-strategy-optimization" ]] || {
            echo "Refusing to run on non-Research checkout."
            exit 1
          }
          test -f research_forward/200wma_v1/config_frozen.json
          test -f engines/research/forward_paper_200wma.py
          git rev-parse HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install research-only dependencies
        run: python -m pip install pandas numpy requests openpyxl

      - name: Verify no-lookahead and frozen model
        run: python -m engines.research.forward_paper_200wma --self-test

      - name: Verify append-only and missed-week safeguards
        run: python -m engines.research.test_paper_forward_integrity

      - name: Verify deterministic Research dashboard
        run: python -m engines.research.test_paper_dashboard

      - name: Capture the newly completed BTC and issuer VBTC week
        run: python -m engines.research.forward_paper_200wma --save

      - name: Update dashboard strictly from frozen research scoreboard
        run: python -m engines.research.paper_dashboard --write

      - name: Publish a weekly portfolio summary in GitHub Actions
        shell: bash
        run: cat research_forward/200wma_v1/DASHBOARD.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit only new Research observations, never Production
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git branch --show-current)" == "research/cycle-strategy-optimization" ]]
          for file in research_forward/200wma_v1/weekly_observations.jsonl research_forward/200wma_v1/scoreboard.json research_forward/200wma_v1/DASHBOARD.md; do
            if [[ -f "$file" ]]; then
              git add -- "$file"
            fi
          done
          if git diff --cached --quiet; then
            echo "No new eligible completed week; Research unchanged."
            exit 0
          fi
          git config user.name "btc-research-paper-bot"
          git config user.email "btc-research-paper-bot@users.noreply.github.com"
          git commit -m "Research-only forward VBTC paper weekly observation"
          # The GitHub write token is supplied ONLY to this commit step,
          # never persisted in the Research checkout or passed to Python.
          auth="$(printf 'x-access-token:%s' "$GH_PUSH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/research/cycle-strategy-optimization

      - name: Open or update a GitHub issue on scheduler failure
        if: ${{ failure() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PAPER_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          title="BTC 200WMA Research paper scheduler needs attention"
          existing="$(gh issue list --state open --limit 100 --json title,number --jq '.[] | select(.title == "BTC 200WMA Research paper scheduler needs attention") | .number' | head -n 1)"
          body="The Wednesday BTC 200WMA Research-only paper-trading run failed. No successful Research update is confirmed. Review the run: $PAPER_RUN_URL . Do not overwrite or backfill historical paper prices, and do not change Production."
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --assignee "aussiekarl-gif" --body "$body"
          fi

      - name: Close a previous failure issue after a clean run
        if: ${{ success() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PAPER_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh issue list --state open --limit 100 --json title,number --jq '.[] | select(.title == "BTC 200WMA Research paper scheduler needs attention") | .number' | head -n 1)"
          if [[ -n "$existing" ]]; then
            gh issue close "$existing" --comment "A subsequent Research-only scheduler run completed successfully: $PAPER_RUN_URL"
          fi
