name: Research Blockchain UTC day-label correction candidate (no trading changes)

on:
  pull_request:
    paths:
      - 'engines/research/cycle_public_daily_timestamp_candidate.py'
      - 'tests/test_cycle_public_daily_timestamp_candidate.py'
      - '.github/workflows/research_cycle_date_label_candidate.yml'
  push:
    branches: [main]
    paths:
      - 'engines/research/cycle_public_daily_timestamp_candidate.py'
      - 'tests/test_cycle_public_daily_timestamp_candidate.py'
      - '.github/workflows/research_cycle_date_label_candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-date-correctness-in-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only current research dependencies
        run: python -m pip install pandas numpy requests
      - name: Validate old source remains unchanged and candidate is causal
        run: |
          python -m py_compile engines/research/cycle_public_daily_timestamp_candidate.py
          python -m unittest discover -s tests -p 'test_cycle_public_daily_timestamp_candidate.py' -v
          python -m unittest discover -s tests -p 'test_cycle_source_disagreement_audit.py' -v
          python -m unittest discover -s tests -p 'test_cycle_forward_kraken_bridge.py' -v
