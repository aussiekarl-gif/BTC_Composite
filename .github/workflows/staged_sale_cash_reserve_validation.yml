name: BTC Staged Sale Cash Reserve Sensitivity Research

on:
  pull_request:
    paths:
      - 'engines/research/staged_sale_cash_reserve_sensitivity.py'
      - 'engines/research/staged_tax_aware_roundtrip.py'
      - 'tests/test_staged_sale_cash_reserve_sensitivity.py'
      - '.github/workflows/staged_sale_cash_reserve_validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  net-sale-reserve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Test no future leakage and AUD reserve against realised cash
        run: |
          python -m py_compile engines/research/staged_sale_cash_reserve_sensitivity.py engines/research/staged_tax_aware_roundtrip.py
          python -m unittest discover -s tests -p 'test_staged_sale_cash_reserve_sensitivity.py' -v
          python -m unittest discover -s tests -p 'test_staged_tax_aware_roundtrip.py' -v
      - name: Compare ordinary cycles and delayed bottom shock with 0/25/40 percent cash reserve
        run: |
          python -m engines.research.staged_sale_cash_reserve_sensitivity --output /tmp/btc_staged_sale_cash_reserve_research.json
      - name: Archive downside and foregone-upside audit
        uses: actions/upload-artifact@v4
        with:
          name: btc-staged-sale-cash-reserve-audit
          path: /tmp/btc_staged_sale_cash_reserve_research.json
          retention-days: 14
