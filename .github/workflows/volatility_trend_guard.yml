name: Research BTC 200WMA Volatility and 50DMA Guard

on:
  pull_request:
    paths:
      - 'engines/research/volatility_trend_guard.py'
      - 'tests/test_volatility_trend_guard.py'
      - '.github/workflows/volatility_trend_guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  volatility-guard-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install unchanged project research dependencies
        run: python -m pip install -r requirements.txt
      - name: Run new causal tests and existing original policy regressions
        run: |
          python -m py_compile engines/research/volatility_trend_guard.py
          python -m unittest discover -s tests -p 'test_volatility_trend_guard.py' -v
          python -m unittest discover -s tests -p 'test_fresh_cash_200wma_matched_backtest.py' -v
          python -m unittest discover -s tests -p 'test_shared_cycle_policy.py' -v
      - name: Execute original-vs-guarded AUD FIFO studies and delayed-bottom scenarios
        run: python -m engines.research.volatility_trend_guard --out artifacts/volatility_trend_guard
      - name: Preserve dated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-volatility-trend-wma-guard-evidence
          path: artifacts/volatility_trend_guard/
          if-no-files-found: ignore
