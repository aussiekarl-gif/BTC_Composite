name: BTC 200WMA quick regression
on:
  push:
    branches: [research/cycle-strategy-optimization]
    paths:
      - '.github/workflows/research_200wma_quick.yml'
      - 'engines/research/test_200wma_12week_execution.py'
      - 'engines/research/test_200wma_smsf_costs.py'
      - 'engines/research/smsf_cgt_ledger.py'
      - 'engines/research/btc_200wma_history.py'
      - 'engines/research/test_200wma_cash_deployment.py'
      - 'engines/research/test_200wma_integrated_cash_and_trading.py'
      - 'engines/research/test_200wma_btc_core_floor.py'
      - 'engines/research/test_200wma_sell_cross_direction.py'
  workflow_dispatch:
jobs:
  quick-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight dependencies
        run: pip install pandas numpy
      - name: Integrated cash and trading accounting regression
        run: python -m engines.research.test_200wma_integrated_cash_and_trading
      - name: Compare permanent BTC core floors against cash-only DCA
        run: python -m engines.research.test_200wma_btc_core_floor
      - name: Archive BTC core floor research
        uses: actions/upload-artifact@v4
        with:
          name: 200wma-btc-core-floor
          path: research_outputs/200wma_btc_core_floor.json
      - name: Test upward and downward sell-crossing triggers
        run: python -m engines.research.test_200wma_sell_cross_direction
      - name: Archive sell-crossing test
        uses: actions/upload-artifact@v4
        with:
          name: 200wma-sell-cross-direction
          path: research_outputs/200wma_sell_cross_direction.json
      - name: Check ETF costs and indicative SMSF tax in USD
        run: python -m engines.research.test_200wma_smsf_costs --currency USD
      - name: Archive USD SMSF cost sensitivity
        uses: actions/upload-artifact@v4
        with:
          name: 200wma-smsf-costs-usd
          path: research_outputs/200wma_smsf_cost_stress_usd.json
      - name: Archive quick validation
        uses: actions/upload-artifact@v4
        with:
          name: 200wma-integrated-quick-check
          path: research_outputs/200wma_integrated_cash_and_trading.json
