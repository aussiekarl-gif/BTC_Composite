name: Staged DCA Research Challenger Validation

on:
  pull_request:
    paths:
      - 'engines/research/staged_value_dca_challenger.py'
      - 'tests/test_staged_value_dca_challenger.py'
      - '.github/workflows/staged_dca_research_validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-buy-challenger:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Validate research-only candidate and lagged-price safeguards
        run: |
          python -m py_compile engines/research/staged_value_dca_challenger.py
          python -m unittest discover -s tests -p 'test_staged_value_dca_challenger.py' -v
      - name: Evaluate archived history for complete 2017/2021 and incomplete 2025
        run: |
          python -m engines.research.staged_value_dca_challenger --output /tmp/staged_dca_cash_cohort_audit.json
      - name: Save complete trade-by-trade research audit
        uses: actions/upload-artifact@v4
        with:
          name: staged-dca-cash-cohort-audit
          path: /tmp/staged_dca_cash_cohort_audit.json
          retention-days: 14
