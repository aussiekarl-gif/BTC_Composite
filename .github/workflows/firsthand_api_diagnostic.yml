name: Firsthand API candidate diagnostic

on:
  push:
    branches: [research/firsthand-api-validation]
    paths:
      - "engines/research/firsthand_api_diagnostic.py"
      - ".github/workflows/firsthand_api_diagnostic.yml"
  workflow_dispatch:

jobs:
  fetch-and-inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requests
        run: pip install requests
      - name: Fetch raw public API payloads
        run: python -m engines.research.firsthand_api_diagnostic --output-dir artifacts/firsthand
      - name: Upload unmodified provider payloads and diagnostic metadata
        uses: actions/upload-artifact@v4
        with:
          name: firsthand-api-raw-diagnostic
          path: artifacts/firsthand/
          if-no-files-found: error
          retention-days: 14
