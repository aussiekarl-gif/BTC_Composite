name: Research Verified Sep-Oct 2026 BTC Price Bridge

on:
  pull_request:
    paths:
      - "engines/research/verified_recent_price_bridge.py"
      - "tests/test_verified_recent_price_bridge.py"
      - ".github/workflows/research_verified_recent_prices.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  price-bridge-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy requests
      - run: python -m py_compile engines/research/verified_recent_price_bridge.py
      - run: python -m unittest discover -s tests -p "test_verified_recent_price_bridge.py" -v

  historical-public-extension:
    needs: price-bridge-unit-tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy requests
      - name: Read historical master + two independent public market sources
        env:
          AUDIT_GITHUB_REPO: aussiekarl-gif/btc-audit-data
          AUDIT_GITHUB_TOKEN: ${{ secrets.AUDIT_GITHUB_TOKEN }}
        run: python -m engines.research.verified_recent_price_bridge --asof 2026-10-16 --output audited_recent_btc_bridge.json
      - uses: actions/upload-artifact@v4
        with:
          name: verified-2026-market-extension-readonly
          path: audited_recent_btc_bridge.json
