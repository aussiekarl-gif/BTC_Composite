name: Research BTC ETF official price source probe
on:
  push:
    branches: [research/cycle-strategy-optimization]
    paths:
      - '.github/workflows/research_vbtc_source_probe.yml'
      - 'engines/research/probe_vbtc_official_history.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-official-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install spreadsheet probe dependencies
        run: pip install pandas requests openpyxl
      - name: Inspect publisher-hosted VBTC history
        run: python -m engines.research.probe_vbtc_official_history
