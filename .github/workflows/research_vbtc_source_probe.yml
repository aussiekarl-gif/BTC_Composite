name: Research VBTC issuer market price verification
on:
  push:
    branches: [research/cycle-strategy-optimization]
    paths:
      - '.github/workflows/research_vbtc_source_probe.yml'
      - 'engines/research/vbtc_official_history.py'
      - 'engines/research/test_vbtc_official_market_vs_nav.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-official-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install issuer-history verification dependencies
        run: pip install pandas numpy requests openpyxl
      - name: Reconcile issuer NAV with last traded price and premiums
        run: python -m engines.research.vbtc_official_history
      - name: Compare historical 52/104-week strategy outcomes at VBTC quoted versus NAV prices
        run: python -m engines.research.test_vbtc_official_market_vs_nav
      - name: Archive actual VBTC issuer trade-vs-NAV sensitivity
        uses: actions/upload-artifact@v4
        with:
          name: 200wma-vbtc-real-market-nav
          path: research_outputs/200wma_vbtc_official_market_vs_nav.json
