name: Canonical Original 200WMA and Day500 Evidence (Research)

on:
  pull_request:
    paths:
      - 'engines/research/original_200wma_day500_evidence.py'
      - 'tests/test_original_200wma_day500_evidence.py'
      - '.github/workflows/original_200wma_day500_evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-research-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Validate original policy and historic-to-live discrepancy
        run: |
          python -m py_compile engines/research/original_200wma_day500_evidence.py
          python -m unittest discover -s tests -p 'test_original_200wma_day500_evidence.py' -v
          python -m unittest discover -s tests -p 'test_shared_cycle_policy.py' -v
      - name: Reproduce original AUD after-tax day500 exit then 200WMA recovery buy
        run: |
          python -m engines.research.original_200wma_day500_evidence --output /tmp/original_200wma_day500_frozen_evidence.json
      - name: Save original-canonical matched hold data
        uses: actions/upload-artifact@v4
        with:
          name: original-200wma-day500-frozen-evidence
          path: /tmp/original_200wma_day500_frozen_evidence.json
          retention-days: 30
