name: Portfolio 2026 Cycle Entry Accuracy

on:
  pull_request:
    paths:
      - "engines/shared/portfolio_execution_accuracy.py"
      - "engines/production/production_app.py"
      - "engines/research/research_app.py"
      - "tests/test_portfolio_execution_accuracy.py"
      - ".github/workflows/portfolio_cycle_entry_accuracy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-calculation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy
      - name: Compile calculation and both Streamlit UIs (no live portfolio reads)
        run: |
          python -m py_compile engines/shared/portfolio_execution_accuracy.py
          python -m py_compile engines/production/production_app.py
          python -m py_compile engines/research/research_app.py
      - name: Validate FX, dynamic weighted cost, fee and missing-data safety
        run: python -m unittest discover -s tests -p "test_portfolio_execution_accuracy.py" -v
