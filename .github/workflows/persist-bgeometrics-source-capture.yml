name: Persist BGeometrics source capture
on:
  push:
    branches: [persist-bgeometrics-source-capture]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: persist-bgeometrics-source-capture
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/patch_persist_bgeometrics_source_capture.py
      - name: Validate
        run: |
          python -m py_compile engines/audit/public_model_audit.py
          python - <<'PY'
          from pathlib import Path
          s=Path('engines/audit/public_model_audit.py').read_text()
          assert 'save THIS endpoint immediately' in s
          assert 'production_source_capture_rows' in s
          assert 'save_audit_memory(memory, endpoint_frame, base)' in s
          PY
      - name: Commit final patch and remove helpers
        run: |
          rm scripts/patch_persist_bgeometrics_source_capture.py .github/workflows/persist-bgeometrics-source-capture.yml
          git config user.name "aussiekarl-gif"
          git config user.email "aussie.karl@gmail.com"
          git add engines/audit/public_model_audit.py scripts .github/workflows
          git commit -m "Persist BGeometrics source endpoints transactionally"
          git push origin HEAD:persist-bgeometrics-source-capture
