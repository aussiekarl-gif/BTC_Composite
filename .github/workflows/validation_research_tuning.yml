name: V5.9 Research Validation

on:
  push:
    branches: [main]
    paths:
      - "engines/research/**"
      - "validation_research_tuning.py"
      - "requirements.txt"
      - ".github/workflows/validation_research_tuning.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run V5.9 validation framework
        env:
          BGEOMETRICS_TOKEN: ${{ secrets.BGEOMETRICS_TOKEN }}
          AUDIT_GITHUB_REPO: ${{ secrets.AUDIT_GITHUB_REPO }}
          AUDIT_GITHUB_TOKEN: ${{ secrets.AUDIT_GITHUB_TOKEN }}
        run: python validation_research_tuning.py
