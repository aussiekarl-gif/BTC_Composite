name: Cowen on-chain daily source refresh

on:
  schedule:
    # Redundant daily windows: GitHub schedule may be delayed or dropped.
    # Avoid the busiest top-of-hour slots. Brisbane (AEST): 09:17, 10:17, 11:17;
    # UTC 23:17, 00:17, 01:17. An external dispatch remains the stronger fix.
    - cron: "17 23 * * *"
    - cron: "17 0 * * *"
    - cron: "17 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cowen_onchain_daily_refresh.yml"
      - "engines/research/cowen_onchain_risk.py"
      - "engines/research/explore21_public_data.py"
      - "engines/research/coinmetrics_community.py"
      - "engines/research/aethereal_public_data.py"
      - "engines/research/obm_cdd_public_data.py"

permissions:
  contents: write

concurrency:
  group: cowen-onchain-daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Preserve published source snapshots for integrity comparison
        run: |
          set -euo pipefail
          mkdir -p /tmp/cowen_onchain_baseline
          cp -a data/research/cowen_onchain/. /tmp/cowen_onchain_baseline/
      - name: Fetch Explore21 daily BTC metrics (retry)
        id: explore21
        continue-on-error: true
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4; do
            echo "Explore21 attempt ${attempt}/4"
            if python -m engines.research.explore21_public_data --output-dir data/research/cowen_onchain/explore21; then exit 0; fi
            if [ "${attempt}" -lt 4 ]; then sleep $((attempt * 20)); fi
          done
          echo "Explore21 failed after four attempts"; exit 1
      - name: Fetch Coin Metrics Community cross-check (retry)
        id: coinmetrics
        continue-on-error: true
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4; do
            echo "Coin Metrics attempt ${attempt}/4"
            if python -m engines.research.coinmetrics_community --output data/research/cowen_onchain/coinmetrics_btc_daily_community.csv; then exit 0; fi
            if [ "${attempt}" -lt 4 ]; then sleep $((attempt * 20)); fi
          done
          echo "Coin Metrics failed after four attempts"; exit 1
      - name: Fetch Aethereal daily transaction fees (normal DNS, then DoH fallback)
        id: aethereal
        continue-on-error: true
        run: |
          set -euo pipefail
          output="data/research/cowen_onchain/bitcoin_network_daily_aethereal.csv"
          for attempt in 1 2 3; do
            echo "Aethereal normal DNS attempt ${attempt}/3"
            if python -m engines.research.aethereal_public_data --output "${output}"; then
              echo "Aethereal fetched using the runner's normal DNS resolver."
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then sleep $((attempt * 10)); fi
          done

          echo "Normal DNS failed; trying Cloudflare DNS-over-HTTPS and pinned HTTPS."
          dns_json="$(curl --fail --silent --show-error --retry 2 --retry-all-errors \
            -H 'accept: application/dns-json' \
            'https://cloudflare-dns.com/dns-query?name=dataset.aethereal.top&type=A')"
          ip="$(printf '%s' "${dns_json}" | python -c 'import json,sys; d=json.load(sys.stdin); print(next((a["data"] for a in d.get("Answer", []) if a.get("type")==1), ""))')"
          if [ -z "${ip}" ]; then
            echo "Cloudflare DoH returned no IPv4 address for Aethereal."
            exit 1
          fi
          echo "Cloudflare DoH resolved dataset.aethereal.top to ${ip}."
          curl --fail --location --silent --show-error --retry 2 --retry-all-errors \
            --connect-timeout 15 --max-time 60 \
            --resolve "dataset.aethereal.top:443:${ip}" \
            'https://dataset.aethereal.top/files/bitcoin-network-daily.csv' \
            --output /tmp/aethereal-bitcoin-network-daily.csv
          python -m engines.research.aethereal_public_data \
            --input-csv /tmp/aethereal-bitcoin-network-daily.csv \
            --output "${output}"
          echo "Aethereal fetched through the DNS-over-HTTPS fallback."
      - name: Fetch Open Bitcoin Metrics daily CDD (retry)
        id: obm
        continue-on-error: true
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4; do
            echo "Open Bitcoin Metrics attempt ${attempt}/4"
            if python -m engines.research.obm_cdd_public_data --output data/research/cowen_onchain/obm_cdd_btcxdays_daily.csv; then exit 0; fi
            if [ "${attempt}" -lt 4 ]; then sleep $((attempt * 20)); fi
          done
          echo "Open Bitcoin Metrics failed after four attempts"; exit 1
      - name: Reject corrupted or regressed source snapshots before publication
        run: python -m engines.research.cowen_onchain_snapshot_guard --baseline /tmp/cowen_onchain_baseline --candidate data/research/cowen_onchain
      - name: Commit successful source updates (partial refresh allowed)
        run: |
          set -euo pipefail
          git add data/research/cowen_onchain
          if git diff --cached --quiet; then
            echo "No valid source snapshot changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(research): refresh Cowen on-chain source snapshots"
          # Concurrent schedule/workflow commits can advance main during a refresh.
          # Rebase the validated data commit onto the latest main and retry push.
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Source snapshots published successfully."
                exit 0
              fi
            else
              git rebase --abort || true
              echo "Rebase conflict; refusing to overwrite concurrent changes."
              exit 1
            fi
            if [ "${attempt}" -lt 3 ]; then sleep $((attempt * 15)); fi
          done
          echo "Unable to publish after three push/rebase attempts."
          exit 1
      - name: Publish refresh health summary and mark incomplete refresh as failed
        if: always()
        env:
          EXPLORE21: ${{ steps.explore21.outcome }}
          COINMETRICS: ${{ steps.coinmetrics.outcome }}
          AETHEREAL: ${{ steps.aethereal.outcome }}
          OBM: ${{ steps.obm.outcome }}
        run: |
          {
            echo "## Cowen on-chain refresh health"
            echo "| Source | Result |"
            echo "|---|---|"
            echo "| Explore21 | ${EXPLORE21:-not-run} |"
            echo "| Coin Metrics | ${COINMETRICS:-not-run} |"
            echo "| Aethereal | ${AETHEREAL:-not-run} |"
            echo "| Open Bitcoin Metrics | ${OBM:-not-run} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${EXPLORE21}" != "success" ] || [ "${COINMETRICS}" != "success" ] || [ "${AETHEREAL}" != "success" ] || [ "${OBM}" != "success" ]; then
            echo "One or more sources failed; any independently validated updates were published, and this run is marked failed for visibility."
            exit 1
          fi
          echo "All four source fetches succeeded."
