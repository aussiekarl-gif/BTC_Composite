name: Cowen on-chain daily source refresh

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cowen_onchain_daily_refresh.yml"
      - "engines/research/cowen_onchain_risk.py"
      - "engines/research/explore21_public_data.py"
      - "engines/research/coinmetrics_community.py"
      - "engines/research/aethereal_public_data.py"
      - "engines/research/obm_cdd_public_data.py"

permissions:
  contents: write

concurrency:
  group: cowen-onchain-daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Preserve published source snapshots for integrity comparison
        run: |
          set -euo pipefail
          mkdir -p /tmp/cowen_onchain_baseline
          cp -a data/research/cowen_onchain/. /tmp/cowen_onchain_baseline/
      - name: Fetch Explore21 daily BTC metrics
        run: |
          python -m engines.research.explore21_public_data \
            --output-dir data/research/cowen_onchain/explore21
      - name: Fetch Coin Metrics Community cross-check
        run: |
          python -m engines.research.coinmetrics_community \
            --output data/research/cowen_onchain/coinmetrics_btc_daily_community.csv
      - name: Fetch Aethereal daily transaction fees
        run: |
          python -m engines.research.aethereal_public_data \
            --output data/research/cowen_onchain/bitcoin_network_daily_aethereal.csv
      - name: Fetch Open Bitcoin Metrics daily CDD
        run: |
          python -m engines.research.obm_cdd_public_data \
            --output data/research/cowen_onchain/obm_cdd_btcxdays_daily.csv
      - name: Reject corrupted or regressed source snapshots before publication
        run: python -m engines.research.cowen_onchain_snapshot_guard --baseline /tmp/cowen_onchain_baseline --candidate data/research/cowen_onchain
      - name: Commit changed source snapshots
        run: |
          git add data/research/cowen_onchain
          if git diff --cached --quiet; then
            echo "No source snapshot changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(research): refresh Cowen on-chain source snapshots"
          git push origin HEAD:main
