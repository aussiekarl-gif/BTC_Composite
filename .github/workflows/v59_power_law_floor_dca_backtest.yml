name: V5.9 Power Law floor DCA backtest (research only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'engines/research/v59_power_law_floor_dca_backtest.py'
      - 'engines/research/v59_causal_timing_horse_race.py'
      - 'engines/research/v59_dynamic_risk_policy.py'
      - 'engines/research/research_model.py'
      - '.github/workflows/v59_power_law_floor_dca_backtest.yml'
  push:
    branches: [main]
    paths:
      - 'engines/research/v59_power_law_floor_dca_backtest.py'
      - 'engines/research/v59_causal_timing_horse_race.py'
      - 'engines/research/v59_dynamic_risk_policy.py'
      - 'engines/research/research_model.py'
      - '.github/workflows/v59_power_law_floor_dca_backtest.yml'
  workflow_dispatch:
  schedule:
    - cron: '47 3 * * 1'
permissions:
  contents: read
jobs:
  matched-threshold-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BTC_PORTFOLIO_BACKEND: sqlite
      BTC_PORTFOLIO_DB_PATH: /tmp/v59_floor_backtest.sqlite3
      NTFY_TOPIC: ''
      GOOGLE_SERVICE_ACCOUNT_JSON: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Compare candidate Power Law floors on matched 104-week cohorts
        run: python -m engines.research.v59_power_law_floor_dca_backtest
      - name: Retain research results
        uses: actions/upload-artifact@v4
        with:
          name: v59-power-law-floor-dca-backtest
          path: artifacts/v59_power_law_floor_dca_backtest.json
          if-no-files-found: error
          retention-days: 90
