name: Publish NAS container image

on:
  push:
    branches:
      - main
    # Publish only if the deployed Streamlit app, its runtime inputs or the
    # Docker build definition changed. Research paper-scheduler and report
    # commits must NOT republish the NAS image.
    paths:
      - 'app.py'
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements.txt'
      - '.streamlit/**'
      - 'engines/**'
      - 'data/**'
      - '.github/workflows/publish_nas_image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-nas-image
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/aussiekarl-gif/btc-composite:latest
            ghcr.io/aussiekarl-gif/btc-composite:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
