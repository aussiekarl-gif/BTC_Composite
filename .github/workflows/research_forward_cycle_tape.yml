name: Research prospective Cycle signal tape (no ntfy)

on:
  push:
    branches:
      - main
    paths:
      - 'engines/research/cycle_forward_signal_tape.py'
      - 'engines/research/cycle_forward_kraken_bridge.py'
      - 'engines/research/ibit_asx_forward_close_tape.py'
      - 'engines/research/forward_market_readiness.py'
      - 'engines/research/btc_unified_research_readiness.py'
      - 'engines/research/forward_ibit_matched_benchmark.py'
      - 'engines/research/cycle_mid_session_asx_timing_audit.py'
      - 'engines/research/cycle_mid_session_capture_health.py'
      - '.github/workflows/research_forward_cycle_tape.yml'
  pull_request:
    paths:
      - 'engines/research/cycle_forward_signal_tape.py'
      - 'engines/research/cycle_forward_kraken_bridge.py'
      - 'tests/test_cycle_forward_kraken_bridge.py'
      - 'tests/test_ibit_asx_forward_close_tape.py'
      - 'tests/test_forward_market_readiness.py'
      - 'tests/test_btc_unified_research_readiness.py'
      - 'engines/research/forward_ibit_matched_benchmark.py'
      - 'tests/test_forward_ibit_matched_benchmark.py'
      - 'engines/research/cycle_mid_session_asx_timing_audit.py'
      - 'engines/research/cycle_mid_session_capture_health.py'
      - 'tests/test_cycle_mid_session_asx_timing_audit.py'
      - 'tests/test_cycle_mid_session_capture_health.py'
      - 'engines/research/btc_unified_research_readiness.py'
      - 'tests/test_cycle_forward_signal_tape.py'
      - '.github/workflows/research_forward_cycle_tape.yml'
  workflow_dispatch:
  schedule:
    # 12:25 UTC = 22:25 Brisbane. Last UTC day is complete.
    - cron: '25 12 * * *'

permissions:
  contents: write

concurrency:
  group: research-cycle-forward-signal-tape
  cancel-in-progress: false

jobs:
  record-only-public-market:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install same research dependencies as Streamlit
        run: python -m pip install -r requirements.txt
      - name: Check frozen model equality, capture invariants and future-only grades
        id: capture_validation
        run: |
          python -m py_compile engines/research/cycle_forward_signal_tape.py engines/research/cycle_forward_kraken_bridge.py engines/research/ibit_asx_forward_close_tape.py engines/research/forward_market_readiness.py
          python -m unittest discover -s tests -p 'test_cycle_forward_signal_tape.py' -v
          python -m unittest discover -s tests -p 'test_cycle_forward_kraken_bridge.py' -v
          python -m unittest discover -s tests -p 'test_ibit_asx_forward_close_tape.py' -v
          python -m unittest discover -s tests -p 'test_forward_market_readiness.py' -v
          python -m unittest discover -s tests -p 'test_btc_unified_research_readiness.py' -v
          python -m unittest discover -s tests -p 'test_cycle_trading_pct_allocation.py' -v
          python -m unittest discover -s tests -p 'test_cycle_market_feed.py' -v
          python -m unittest discover -s tests -p 'test_cycle_mid_session_asx_timing_audit.py' -v
          python -m unittest discover -s tests -p 'test_cycle_mid_session_capture_health.py' -v
      - name: Capture only last VERIFIED completed close and market-level Cycle signal
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python -m engines.research.cycle_forward_signal_tape
      - name: Optional same-day Sydney ASX IBIT.AX AUD close (indicative only, no ntfy)
        # Independently capture prospective ASX close even if today's BTC
        # verification fails closed; never overwrite the BTC market signal.
        if: ${{ !cancelled() && steps.capture_validation.outcome == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: python -m engines.research.ibit_asx_forward_close_tape
      - name: Verify BOTH immutable market tapes and write read-only forward sample report
        # Run even if BTC vendor collection fails, but NEVER if unit tests
        # failed. This also prevents tampered prices being published.
        id: readiness
        if: ${{ !cancelled() && steps.capture_validation.outcome == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: python -m engines.research.forward_market_readiness
      - name: Build unified read-only BTC research readiness (optional artifact)
        if: ${{ !cancelled() && steps.capture_validation.outcome == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          if ! python -m engines.research.btc_unified_research_readiness; then
            echo '::warning::Unified research status could not be generated; immutable BTC and ASX source publishing stays governed by the independent readiness audit.'
          fi
      - name: Read-only fair matched ASX paper benchmark, only genuine future source records
        if: ${{ !cancelled() && steps.capture_validation.outcome == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          if ! python -m engines.research.forward_ibit_matched_benchmark; then
            echo '::warning::Paper benchmark unavailable; protect independent immutable source publication.'
          fi
      - name: Read-only prospective same-session vs next ASX close timing study
        if: ${{ !cancelled() && steps.capture_validation.outcome == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          if ! python -m engines.research.cycle_mid_session_asx_timing_audit; then
            echo '::warning::Mid-session ASX timing study unavailable; preserve independent source tapes.'
          fi
      - name: Independently audit today's mid-session source at Sydney NIGHT, never backfill
        if: ${{ !cancelled() && steps.capture_validation.outcome == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          if ! python -m engines.research.cycle_mid_session_capture_health; then
            echo '::warning::Read-only independent mid-session capture-health report could not run.'
          fi
      - name: Preserve prospective source record even if repository write is blocked
        if: ${{ !cancelled() && steps.capture_validation.outcome == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: cycle-forward-market-signal-capture
          path: |
            data/research_forward_validation/
            artifacts/forward_readiness.json
            artifacts/btc_unified_research_readiness.json
            artifacts/forward_ibit_matched_benchmark.json
            artifacts/cycle_mid_session_asx_timing_audit.json
            artifacts/research_mid_session_capture_health.json
          if-no-files-found: ignore
      - name: Save only new immutable research observation and matured scores
        # A failed test OR failed chained-data audit must NEVER publish
        # any research market data even when BTC provider failed earlier.
        if: ${{ !cancelled() && steps.capture_validation.outcome == 'success' && steps.readiness.outcome == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- data/research_forward_validation/
          if git diff --cached --quiet; then
            echo 'No new verified BTC close or matured horizon to record.'
          else
            git commit -m 'Research forward BTC Cycle signal tape: completed-close capture [skip ci]'
            git push origin HEAD:main
          fi
