name: Research Cycle Trading Streamlit Dashboard

on:
  pull_request:
    paths:
      - "app.py"
      - "engines/research/cycle_trading_app.py"
      - "engines/research/cycle_trading_dashboard_model.py"
      - "engines/research/cycle_aud_price_levels.py"
      - "tests/test_cycle_aud_price_levels.py"
      - "tests/test_cycle_trading_dashboard_model.py"
      - ".github/workflows/research_cycle_trading_dashboard.yml"
      - "engines/research/cycle_trade_execution_safety.py"
      - "engines/research/cycle_market_feed.py"
      - "tests/test_cycle_trading_sensecheck.py"
      - "engines/research/cycle_wallet_readonly_status.py"
      - "tests/test_cycle_wallet_readonly_status.py"
      - "engines/research/cycle_real_sale_budget.py"
      - "tests/test_cycle_real_sale_budget.py"
      - "engines/research/cycle_funding_provenance.py"
      - "tests/test_cycle_funding_provenance.py"
      - "engines/research/cycle_portfolio_editor.py"
      - "engines/shared/portfolio_transactions.py"
      - "tests/test_cycle_market_feed.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter-navigation-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact app dependencies
        run: pip install -r requirements.txt
      - name: Compile new Streamlit route and pure calculations
        run: python -m py_compile app.py engines/research/cycle_trading_app.py engines/research/cycle_trading_dashboard_model.py
      - name: Regression of read-only Google portfolio, 200WMA and navigation
        run: python -m unittest discover -s tests -p "test_cycle_trading_dashboard_model.py" -v
      - name: Check AUD cycle high, post-peak low and percentage calculations
        run: python -m unittest discover -s tests -p "test_cycle_aud_price_levels.py" -v
      - name: Verify original 200WMA/day500 portfolio shadow never invents executable trades
        run: python -m unittest discover -s tests -p "test_cycle_wallet_readonly_status.py" -v
      - name: Reconcile executed original BTC sales, tax and single weekly cash tranche
        run: python -m unittest discover -s tests -p "test_cycle_real_sale_budget.py" -v
      - name: Confirm optional original-cycle BUY funding labels never change executed holdings
        run: python -m unittest discover -s tests -p "test_cycle_funding_provenance.py" -v
      - name: Existing historical FIFO rebuy regression
        run: python -m unittest discover -s tests -p "test_day500_aftertax_reinvestment.py" -v
      - name: Validate shared public price crosscheck
        run: python -m unittest discover -s tests -p 'test_cycle_market_feed.py' -v
