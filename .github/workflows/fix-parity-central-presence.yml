name: Fix parity central presence
on:
  push:
    branches:
      - fix-parity-central-presence
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/patch_parity_presence.py
      - name: Validate
        run: |
          python -m py_compile engines/shared/parity_app.py
          grep -q 'CENTRAL PRESENT' engines/shared/parity_app.py
          grep -q 'True central-source gaps' engines/shared/parity_app.py
      - name: Commit final patch and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-parity-central-presence.yml
          rm tools/patch_parity_presence.py
          git add -A
          git commit -m "Distinguish central presence from live parity availability"
          git push
