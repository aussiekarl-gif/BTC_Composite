name: One-off model/UI separation

on:
  push:
    branches:
      - refactor-model-ui-separation
    paths:
      - scripts/refactor_model_ui.py
      - .github/workflows/refactor-model-ui.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor-model-ui-separation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application dependencies
        run: pip install -r requirements.txt

      - name: Split model logic from Streamlit UI and validate
        run: python scripts/refactor_model_ui.py

      - name: Commit validated refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No refactor changes produced"; exit 1; }
          git commit -m "Separate Production and Research models from Streamlit UI"
          git push origin HEAD:refactor-model-ui-separation
