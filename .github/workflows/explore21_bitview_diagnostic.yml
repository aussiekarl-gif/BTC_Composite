name: Explore21 and Bitview Public Data Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install diagnostic dependencies
        run: pip install requests
      - name: Fetch raw source snapshots and metadata
        run: python engines/research/explore21_bitview_diagnostic.py
      - name: Upload raw snapshots and diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: explore21-bitview-raw-diagnostic
          path: artifacts/source-diagnostic/
          if-no-files-found: error
          retention-days: 14
